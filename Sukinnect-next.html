function ic(name, size = 18, weight){
  const rname = REICON_MAP[name];
  if (rname && window.REICON_READY !== false) {
    return '<re-icon icon="' + rname + '" size="' + size + '"' + (weight === 'filled' ? ' weight="filled"' : '') + ' style="flex-shrink:0; vertical-align:-3px;"></re-icon>';
  }
  const def = ICONS[name];
  if(!def) return '';
  const body = (weight === 'filled' && def.f) ? def.f : def.o;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; vertical-align:-3px;">' + body + '</svg>';
}

window.REICON_READY = true;
// reicon ships locally now (reicon.js beside this file): the icon set is
// always available offline. Upgrade to <re-icon> as soon as it registers;
// only fall back to the built-in inline SVGs if it never does.
if (window.customElements && customElements.whenDefined) {
  customElements.whenDefined('re-icon').then(function(){
    window.REICON_READY = true;
    if (typeof render === 'function') render();
  });
}
setTimeout(function(){
  if (!window.customElements || !customElements.get('re-icon')) {
    window.REICON_READY = false;
    if (typeof render === 'function') render();
  }
}, 4000);

/* ---- money -------------------------------------------------------------
   Every amount in this application is an integer number of centavos, and every
   field that holds one says so in its name (rateCentavos, amountCentavos).
   Float pesos cannot hold 0.10 exactly, so a percentage fee computed on a float
   eventually prints a cent nobody charged; and an untyped 350 is indistinguish-
   able from 35000, which is how half-converted money starts. The unit is part
   of the name so a missed conversion cannot look like a converted value.
   -------------------------------------------------------------------------- */
const CENT = 100;                       // centavos in one peso
function toCentavos(pesos){ return Math.round(pesos * CENT); }
function toPesos(centavos){ return centavos / CENT; }

/* Exact money: always two decimals. For a breakdown, a receipt, a statement. */
/* One demo line for both roles. A prototype has no telephony, but a button drawn
     as a call has to open a dialer instead of congratulating you. */
const DEMO_HOTLINE = '+639170001122';

function peso(centavos){
  const n = Math.round(centavos), sign = n < 0 ? '-' : '', abs = Math.abs(n);
  return sign + '₱' + Math.floor(abs / CENT).toLocaleString('en-PH')
    + '.' + String(abs % CENT).padStart(2, '0');
}

/* One-line money for cards, chips and lists: whole pesos drop the decimals. */
function pesoShort(centavos){
  const n = Math.round(centavos);
  return (n % CENT === 0) ? peso(n).replace('.00', '') : peso(n);
}

/* Stat tiles and chart axes: ₱42.8k rather than a number that breaks the row.
   Abbreviated only past ₱10,000 — a five-figure amount is still readable in full,
   and ₱4,200 written as ₱4.2k reads like a rounding the books never made. */
function pesoCompact(centavos){
  const p = toPesos(Math.round(centavos)), sign = p < 0 ? '-' : '', a = Math.abs(p);
  const one = v => { const t = (Math.round(v * 10) / 10).toFixed(1); return t.endsWith('.0') ? t.slice(0, -2) : t; };
  if (a >= 1000000) return sign + '₱' + one(a / 1000000) + 'M';
  if (a >= 10000)   return sign + '₱' + one(a / 1000) + 'k';
  return sign + '₱' + Math.round(a).toLocaleString('en-PH');
}

/* A provider's published rate the way a customer reads it. */
function rateLabel(rateCentavos, unit){
  return pesoShort(rateCentavos) + (unit ? ' / ' + unit : '');
}

// Five-star row with proportional fill. A rating of 4.3 renders as four solid
// stars plus a partial fifth, so a score reads as a rating instead of one
// lonely star next to a number. onDark switches the empty-star colour.
function stars(rating, size = 11, onDark){
  const r = Math.max(0, Math.min(5, Number(rating) || 0));
  const pct = (r / 5) * 100;
  const row = ic('star', size, 'filled').repeat(5);
  return '<span class="stars' + (onDark ? ' on-dark' : '') + '" role="img" aria-label="' + r.toFixed(1) + ' out of 5 stars">'
       + '<span class="row5 base">' + row + '</span>'
       + '<span class="row5 fill" style="width:' + pct + '%">' + row + '</span>'
       + '</span>';
}

const SNACK_ICON = { success:'check-circle', warn:'alert-triangle', error:'alert-triangle' };

// kind is optional: every existing call site is a success confirmation, and the
// few that report a problem pass 'warn' or 'error' so the icon matches the words.
function showToast(message, kind){
  const state = kind === 'warn' || kind === 'error' ? kind : 'success';
  let root = document.getElementById('toast-root');
  if(!root){
    root = document.createElement('div');
    root.id = 'toast-root';
    document.querySelector('.phone').appendChild(root);
  }
  const t = document.createElement('div');
  t.className = 'toast';
  t.dataset.kind = state;
  const icon = document.createElement('span');
  icon.className = 't-ic';
  icon.setAttribute('aria-hidden', 'true');
  icon.innerHTML = ic(SNACK_ICON[state], 15);
  const text = document.createElement('span');
  // The message often carries a name typed or stored elsewhere, so it goes in as
  // text, never as markup (56).
  text.textContent = message;
  t.appendChild(icon);
  t.appendChild(text);
  root.appendChild(t);
  while(root.children.length > 2) root.removeChild(root.firstChild);
  // Clear of the bottom nav where the thumb already is, and of the nav's own
  // safe-area padding; screens without a nav get the plain bottom edge (7.4).
  const nav = document.querySelector('.bottomnav');
  root.style.bottom = nav
    ? (nav.getBoundingClientRect().height + 14) + 'px'
    : 'calc(16px + var(--sab))';
  t.setAttribute('role', 'status');
  setTimeout(() => {
    t.classList.add('hide');
    setTimeout(() => t.remove(), 300);
  }, 2600);
}

/* What you type is a record, not a painted bubble: it survives the next render,
   it shows up in the other side's thread list, and it is what the thread is
   about. The old version appended a node to the screen and congratulated the
   reader with "Message sent" while storing nothing anywhere. */
function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = (input && input.value ? input.value : '').trim();
  if(!text){ showToast('Type a message first'); return; }
  const side = state.role === 'provider' ? 'provider' : 'customer';
  appendMessage(currentThreadKey(), state.activeChatBookingId, side, text);
  markThreadRead();
  render();
  const list = document.getElementById('chat-msg-list');
  if (list) list.scrollTop = list.scrollHeight;
  const again = document.getElementById('chat-input');
  if (again) again.focus();
  showToast('Sent');
}

// Anything that came from the user is echoed back into the interface, so it
// stays data and never becomes markup.
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// One empty state for every list that can legitimately hold no rows: which
// list (icon), what is missing (title), what to do next (body + action).
function emptyState(icon, title, body, action){
  return `<div class="empty">
    <div class="empty-icon">${ic(icon,22)}</div>
    <div class="empty-title">${title}</div>
    <div class="empty-body">${body}</div>
    ${action ? `<button class="btn sm secondary" id="${action.id}">${action.label}</button>` : ''}
  </div>`;
}

// Booking rails for both roles share one empty state. The wording has to tell
// an empty stage apart from an empty list, and offer the exit that belongs to
// the role: a resident with no bookings still needs to find a provider, while a
// provider with no requests waits on supply, not on search.
function bookingListEmpty(filter, role){
  const onAll = filter === 'all';
  if(!onAll){
    return emptyState('inbox',
      'No ' + filter + ' bookings',
      'Nothing is in this stage right now. Switch to All to see every booking and its record.',
      { id:'bookings-show-all-btn', label:'Show all bookings' });
  }
  return role === 'provider'
    ? emptyState('inbox', 'No requests yet',
        'Customer requests land here the moment they are sent. Nothing has reached this account in the sample marketplace yet.',
        { id:'bookings-open-fsm-btn', label:'Open FSM dispatch' })
    : emptyState('inbox', 'No bookings yet',
        'Services you request appear here with their status, payment record and receipt.',
        { id:'bookings-find-btn', label:'Find a service' });
}

// Search text and the sheet's filters narrow the list through this one path, so
// the count the sheet promises is the count the screen delivers.
function providerMatches(){
  const query = (state.searchQuery || '').trim().toLowerCase();
  const f = state.providerFilters || {};
  return PROVIDERS.filter(p =>
    (!query || p.name.toLowerCase().includes(query) ||
      p.service.toLowerCase().includes(query) ||
      p.barangay.toLowerCase().includes(query)) &&
    (!f.serviceId || p.serviceId === f.serviceId) &&
    (!f.barangay || p.barangay === f.barangay) &&
    (!f.maxWait || p.availabilityMin <= f.maxWait)
  );
}

function activeFilterCount(){
  const f = state.providerFilters || {};
  return (f.serviceId ? 1 : 0) + (f.barangay ? 1 : 0) + (f.maxWait ? 1 : 0);
}

function repaintOnly(){ render(); }

function openSheet(name){ state.sheet = name; render(); }
function closeSheet(){ state.sheet = null; render(); }

function toggleProviderFilter(key, value){
  const f = state.providerFilters;
  f[key] = f[key] === value ? null : value;
  render();
}

function resetProviderFilters(){
  state.providerFilters = blankFilters();
  render();
}

function blankFilters(){
  return { serviceId:null, barangay:null, maxWait:null };
}

// The empty result list offers one way out: drop everything that narrowed it,
// because clearing only the search still leaves the filters in place.
function clearDiscovery(){
  state.searchQuery = '';
  state.providerFilters = blankFilters();
  runDiscovery();
}

function applyProviderFilters(){
  state.sheet = null;
  runDiscovery();
}

// The prototype has no backend to wait for, so a search holds the matching state
// just long enough to read. Reduced motion skips the wait instead of trading one
// animation for another.
function runDiscovery(){
  clearTimeout(runDiscovery._t);
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    state.searching = false; render(); return;
  }
  state.searching = true;
  render();
  runDiscovery._t = setTimeout(() => { state.searching = false; render(); }, 620);
}

// Every route into the results list goes through here, so the matching state
// always shows, whether the resident typed a search or the Concierge handed one
// over.
function startDiscovery(query){
  state.searchQuery = query;
  state.tab = 'results';
  runDiscovery();
}

// A category is a narrowing request rather than a text search: it replaces the
// previous shortlist. Both the Home tiles and the Concierge hand-off use this so
// the two entry points cannot drift apart.
function openCategory(serviceId){
  state.searchQuery = '';
  state.providerFilters = Object.assign(blankFilters(), { serviceId: serviceId });
  state.tab = 'results';
  runDiscovery();
}

function openBookingDetail(bookingId){
  state.selectedBookingId = bookingId;
  state.tab = 'booking_detail';
  render();
}

// The route is read off the record rather than trusted from the notification, so
// a reference to something no longer there cannot strand the tap.
function notificationRoute(n){
  if(n.bookingId){
    const b = bookingById(n.bookingId);
    if(b) return { kind:'booking', id:b.id, label: b.status === 'completed' && !b.myRating ? 'booking to rate' : 'booking' };
  }
  if(n.providerId && PROVIDERS.some(p => p.id === n.providerId)){
    return { kind:'provider', id:n.providerId, label:'provider profile' };
  }
  return null;
}

function openNotification(id){
  const n = NOTIFICATIONS.find(x => x.id === id);
  if(!n) return;
  n.unread = false;
  const route = notificationRoute(n);
  if(!route){ render(); return; }
  if(route.kind === 'booking'){ openBookingDetail(route.id); return; }
  openProviderDetail(route.id, 'notifications');
}

const SHEET_LABELS = { providerFilters:'Filter providers', bookingRequest:'Book an appointment', raiseCase:'Raise a case' };

const REQUEST_TIMES = ['8:00 AM','10:00 AM','1:00 PM','3:00 PM','5:00 PM'];

// The three nearest days, worked out when the sheet opens, so a request the
// resident raises now reads as a real upcoming job instead of inheriting a
// frozen date from the sample records.
function requestDays(){
  const now = new Date();
  return [0,1,2].map(offset => {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
    const date = d.toLocaleDateString('en-PH', { weekday:'short', month:'short', day:'numeric' });
    return { date, label: offset === 0 ? 'Today' : offset === 1 ? 'Tomorrow' : date };
  });
}

/* Two ways the money can travel, named in words and carried as codes. The
   resident picks a route; the record keeps the code, so the rules cannot drift
   with the copy. */
function requestPaymentOptions(){
  return [
    { code:'gcash', label: PAY_METHODS.gcash },
    { code:'cash',  label: PAY_METHODS.cash  }
  ];
}

// Provider Detail is entered from results, from a booking, and from admin. One
// entry point keeps the map initialisation and the back target identical for all
// of them instead of drifting per call site.
function openProviderDetail(providerId, fromTab){
  const p = PROVIDERS.find(x => x.id === providerId) || PROVIDERS[2];
  state.selectedProvider = p;
  state.previousTab = fromTab || 'results';
  state.tab = 'provider_detail';
  render();
  setTimeout(() => {
    if(document.getElementById('leafletmap')){
      /* Every provider was pinned to the same barangay. The card names a person;
         the map has to show where that person works. */
      const at = [p.lat, p.lng];
      const map = L.map('leafletmap').setView(at, 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.marker(at).addTo(map).bindPopup(p.name + ' \u00b7 ' + p.service);
    }
  }, 100);
}

// this provider, carry the wording across instead of asking twice.
function openBookingRequest(){
  const p = state.selectedProvider;
  if(!p) return;
  const carried = state.conciergeAnalyzed && state.conciergeServiceId === p.serviceId
    ? [state.conciergeInput].concat(state.conciergeNotes || []).filter(Boolean).join(' ')
    : '';

  state.requestError = null;
  openSheet('bookingRequest');
}

/* Which job on this provider's list the resident is asking for, and what it costs
   under today's configuration. Nothing here is stored yet: the terms freeze when
   the provider accepts, not before. */
function draftListing(p, d) {
  const list = listingsOf(p.id);
  if (!list.length) return null;
  return list[Math.min(d.listingIdx || 0, list.length - 1)];
}
function draftBreakdown(p, d) {
  const listing = draftListing(p, d);
  return computeBreakdown({
    baseCentavos: listing ? listing.basePriceCentavos : p.rateCentavos,
    categoryId: listing ? listing.categoryId : p.serviceId,
    inclusions: []
  });
}
/* A provider offers several jobs at several prices; "from ₱X" is the honest
   headline until the resident says which one they want. */
function cheapestListing(p) {
  const list = listingsOf(p.id);
  if (!list.length) return p.rateCentavos;
  return list.reduce((min, l) => Math.min(min, l.basePriceCentavos), list[0].basePriceCentavos);
}
function toggleRequestAsap() {
  state.requestDraft.asap = !state.requestDraft.asap;
  render();
}
function listingRail(p, d) {
  const list = listingsOf(p.id);
  if (list.length < 2) return '';
  return `<div class="sheet-group">
        <div class="sheet-label">Which job</div>
        <div class="hscroll req-rail">
          ${list.map((l, i) => requestPick((d.listingIdx || 0) === i, esc(l.title) + ' · ' + pesoShort(l.basePriceCentavos), `pickRequest('listingIdx',${i})`)).join('')}
        </div>
      </div>`;
}
/* Every line the resident is being asked to agree to, and where the money goes. */
function termsCard(p, d, pay, cash) {

          <div class="row"><span>Sukinnect service fee</span><b class="mut">nothing added to your total</b></div>
          <div class="row" style="border-top:1px solid var(--line); padding-top:8px; margin-top:4px;">
            <span style="font-weight:800; color:var(--ink);">You pay</span>

          </div>

          <p>
            This is a starting price, not a final quote &mdash; the provider confirms the scope

            ${cash

            Our fee comes out of the provider's share, which is why the amount above matches

/* The tracking view reads the events the machine wrote, so a step cannot look
   finished unless something actually finished it. */
function timelineRows(b) {
  const steps = bookingTimeline(b.id);
  if (!steps.length) return `<div style="color:var(--mist);">${ic('clock', 12)} Request recorded</div>`;
  return steps.map((e, i) => {
    const last = i === steps.length - 1;
    const when = agoText(e.at);
    return last
      ? `<div style="font-weight:700; color:var(--deep); display:flex; align-items:center; gap:4px;">${ic('clock', 12)} ${label(e.to)} <span style="color:var(--mist); font-weight:600;">&middot; ${when}</span></div>`
      : `<div style="display:flex; align-items:center; gap:4px;">${ic('check', 12)} ${label(e.to)} <span style="color:var(--mist);">&middot; ${when}</span></div>`;
  }).join('');
}
/* What walking away costs, told before the button rather than after. */
function cancelWarning(b) {
  const late = b.status !== 'requested';
  const fee = late ? CONFIG.cancellationFeeAfterAcceptCentavos : CONFIG.cancellationFeeBeforeAcceptCentavos;
  return `<div style="font-size:var(--t-caption); color:${fee ? 'var(--warning-ink)' : 'var(--mist)'}; line-height:1.5;">
    ${fee
      ? ic('alert-triangle', 12) + ' Cancelling now costs ' + peso(fee) + ', paid to ' + esc(providerOf(b).name.split(' ')[0]) + ' for the visit they held or made.'
      : 'Withdrawing now costs you nothing — nothing has been agreed and nothing has been charged.'}
  </div>`;
}
function cancelRow(b) {
  if (['completed', 'cancelled', 'expired', 'no_show', 'disputed'].includes(b.status)) return '';
  const late = b.status !== 'requested';
  return `<div style="margin-top:12px;">
        ${cancelWarning(b)}
        <button type="button" class="btn sm ${late ? 'secondary' : 'danger'}" style="width:100%; margin-top:10px; border-radius:10px;" onclick="cancelBookingRequest('${b.id}')">
          ${late ? 'Cancel this booking' : 'Withdraw this request'}
        </button>
      </div>`;
}

/* ---- raising a case --------------------------------------------------------
   The machine has allowed a job to go "Under review" from three states, but until
   now nothing in the app led there: `openDispute` had no caller, so the evidence
   chain, the freeze and the help desk could only ever be reached by the one seeded
   case. Both parties now get a door, and it is the case record that opens, not the
   status alone. */
function caseActor(){
  return state.role === 'provider'
    ? { role:'provider', id: CURRENT_PROVIDER_ID }
    : { role:'customer', id: CURRENT_CUSTOMER_ID };
}

/* Which of the two words applies: can this state be disputed at all, and if it can,
   is it this person, inside this job's window? */
function caseDoor(b, actor){
  /* Checked first, because a job already under review has no disputed transition
     of its own — the door is shut precisely because someone is already walking it. */
  if (DISPUTES.some(d => d.bookingId === b.id && d.status === 'under review'))
    return { kind:'open' };
  const rules = TRANSITIONS[b.status] && TRANSITIONS[b.status].disputed;
  if (!rules) return { kind:'none' };
  const allowed = transitionAllowed(b, 'disputed', actor);
  return allowed.ok ? { kind:'offer', actors: rules.actors } : { kind:'refused', reason: allowed.reason };
}

function caseRow(b){
  const door = caseDoor(b, caseActor());
  if (door.kind === 'none') return '';
  if (door.kind === 'open') {
    const d = DISPUTES.find(x => x.bookingId === b.id && x.status === 'under review');
    return `<div class="case-note case-note-live">${ic('scale',13)}
        <span>Case ${esc(d.id)} is with the help desk — ${d.evidence.length} records attached, and nothing has been decided yet.</span></div>`;
  }
  if (door.kind === 'refused')
    return `<div class="case-note">${ic('alert-triangle',13)} <span>${esc(door.reason)}</span></div>`;
  return `<button type="button" class="btn sm secondary case-button" onclick="openCaseSheet('${b.id}')">
      ${ic('scale',14)} Something went wrong with this job</button>`;
}

function openCaseSheet(bookingId){

function raiseCaseSheet(){
  const b = bookingById(state.caseBookingId);
  if(!b) return '';
  const claim = b.pricing ? b.pricing.customerTotalCentavos : b.amountCentavos;
  /* What opening this case would freeze — what the job has actually paid the
     provider, less anything an earlier case already holds. Reading
     accountBalance('dispute_hold') here instead would always say "nothing",
     because the freeze has not happened yet: the form is answered before it. */
  const holdable = Math.max(0, creditedFor(b.id, 'provider_payable')

function submitCase(){
  const b = bookingById(state.caseBookingId);
  if(!b){ state.caseBookingId = null; closeSheet(); return; }
  const box = document.getElementById('case-reason');
  const reason = (box && box.value ? box.value : '').trim();

  try { d = openDispute(b.id, caseActor(), reason); }
  catch (err) { showToast(err.message, 'error'); return; }
  state.caseBookingId = null;
  state.sheet = null;
  showToast('Case ' + d.id + ' opened - the help desk has the job, the timeline and the money record');
  render();
}

let bookingSeq = 100;

function submitBookingRequest(){
  if(state.requestSubmitting) return;
  const p = state.selectedProvider;
  const d = state.requestDraft;
  if(!p || !d) return;
  const field = document.getElementById('request-service');
  const text = (field ? field.value : d.service || '').trim();
  d.service = text;
  if(text.length < 5){
    state.requestError = 'Tell the provider what to expect in a few words - a request with no description gets passed over.';
    render();
    // render() replaces the sheet, so the field held before it is detached.
    // Focus the live node or the caret is lost the moment it is needed.
    const live = document.getElementById('request-service');
    if(live){ live.focus(); live.setSelectionRange(live.value.length, live.value.length); }
    return;
  }
  state.requestError = null;
  state.requestSubmitting = true;
  render();
  setTimeout(() => {
    const days = requestDays();
    const pays = requestPaymentOptions();
    const pay = pays[d.payIdx] || pays[0];
    const me = customerOf({ customerId: CURRENT_CUSTOMER_ID });
    const listing = draftListing(p, d);
    const indicative = draftBreakdown(p, d);
    const booking = {
      id: 'b' + (++bookingSeq),
      /* One record, two views: the resident reads it by customerId, this provider
         reads the same object by providerId. Nothing is copied. */
      customerId: CURRENT_CUSTOMER_ID,
      providerId: p.id,
      listingId: listing ? listing.id : null,
      listingTitle: listing ? listing.title : p.service,
      summary: listing ? listing.title : serviceMeta(p.serviceId).label + ' requested',
      request: text,
      date: d.asap ? 'As soon as possible' : days[d.dayIdx].date,
      time: d.asap ? 'Next available' : REQUEST_TIMES[d.timeIdx],
      eta: d.asap ? p.availabilityMin + ' mins' : null,
      status: 'requested',
      /* Indicative, not agreed. The terms freeze when the provider accepts. */
      amountCentavos: indicative.customerTotalCentavos,
      barangay: me.barangay,
      lat: me.lat,
      lng: me.lng,
      notes: '',
      createdAt: new Date().toISOString(),
      source: 'live',
      arrivalTime: 'Awaiting provider',
      payStatus: pay.code === 'cash' ? 'pending_site' : 'unpaid',
      payMethod: pay.code,
      address: (state.profileData.savedAddresses || [state.profileData.address])[d.addrIdx]
    };

    BOOKINGS.unshift(booking);
    /* The request itself opens the thread. Nobody replies on the provider's
       behalf: the answer arrives when they actually accept. */
    postMessage(booking, 'customer', booking.request);
    NOTIFICATIONS.unshift({
      id: 'n' + booking.id,
      title: 'Request sent to ' + p.name,
      body: 'Waiting for them to accept ' + booking.date + ' at ' + booking.time + '.',
      time: 'Just now',
      unread: true,
      icon: 'clock',
      bg: 'var(--deep-100)',
      bookingId: booking.id
    });
    persist();                     // the request is a record now; the provider must be able to find it
    state.requestSubmitting = false;
    state.requestDraft = null;
    state.sheet = null;
    openBookingDetail(booking.id);
    showToast('Request sent - ' + p.name + ' has to accept it');
  }, 900);
}

function cancelBookingRequest(id){
  const b = bookingsForResident().find(x => x.id === id);
  if(!b || b.status !== 'requested') return;
  try {
    attemptTransition(id, 'cancelled', { role:'customer', id: CURRENT_CUSTOMER_ID },
                      { reason:'Cancelled by you while waiting for the provider' });
    showToast('Request withdrawn - the provider is no longer notified');
  } catch (err) {
    /* A refused move is told in the machine's words, not swallowed. */
    showToast(err.message, 'error');
  }
  render();
}

// The layer mounts once per sheet, then only the panel's contents are replaced,
// so tapping a chip updates the rows in place instead of replaying the slide-up.
function renderSheet(){
  const root = document.getElementById('sheet-root');
  if(!root) return;
  if(!state.sheet){ root.innerHTML = ''; root._open = null; return; }
  if(root._open !== state.sheet){
    root.innerHTML = `<div class="sheet-layer">
      <button type="button" class="sheet-scrim" onclick="closeSheet()" aria-label="Close"></button>
      <div class="sheet" role="dialog" aria-modal="true"></div>
    </div>`;
    root._open = state.sheet;
  }
  const panel = root.querySelector('.sheet');
  panel.setAttribute('aria-label', SHEET_LABELS[state.sheet] || 'Options');
  panel.innerHTML = sheetHTML();
}

// The launch screen plays once per cold load. render() is re-invoked at boot by
// the icon set resolving, so the timer is armed only the first time; otherwise
// the splash would restart under itself.
function bootFromSplash(){
  const el = document.getElementById('splash-screen');
  const go = () => { clearTimeout(bootFromSplash._t); bootFromSplash._t = undefined; state.view = 'login'; render(); };
  if(el) el.onclick = go;
  if(bootFromSplash._t === undefined){
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    bootFromSplash._t = setTimeout(go, reduce ? 250 : 1250);
  }
}

/* The tabs the bottom nav lands on. These get the large title; everything you
   drill into from them stays compact (7.2). */
const ROOT_TABS = {
  resident: ['home','bookings','messages','profile'],
  provider: ['dashboard','fsm','bookings','messages','profile'],
  admin:    ['admin_dashboard','admin_verifications','admin_disputes','profile']
};

function render(){
  const screen = document.getElementById('screen');
  const nav = document.getElementById('navbar');

  // Motion contract: only a genuinely different destination replays the
  // entrance glide. Filters, toggles, accordions and edits (authMode, the
  // *Section values, isEditing*) repaint in place — no replay, no scroll jump,
  // so a tap never looks like a page reload.
  const destination = [
    state.view,
    // On the login screen the role picker is an in-place control, not a
    // destination: picking Admin should not replay the entrance glide.
    state.view === 'login' ? '' : state.role,
    state.tab,
    state.isChatOpen ? 1 : 0, state.adminScreen || '',
    state.selectedProvider && state.selectedProvider.id ? state.selectedProvider.id : '',
    state.selectedBookingId || '', state.selectedProviderBookingId || ''
  ].join('|');
  const changed = render._dest !== destination;
  render._dest = destination;

  // An open chat is a drill-in inside the Messages tab, not the tab itself.
  const root = !state.isChatOpen && (ROOT_TABS[state.role] || []).includes(state.tab);
  screen.dataset.root = state.view === 'app' && root ? '1' : '0';

  // A modal belongs to the screen that raised it: if the destination
  // changed, drop any modal still flagged so it cannot re-open on a later
  // visit (this is what left the log-out dialog popping up by itself).
  if(changed) clearModals();

  // The sheet lives in its own layer above the screen and the tab bar, so it
  // paints independently of whichever screen is underneath it.
  renderSheet();

  // Keep the reader's place during in-place updates; start at the top of a
  // genuinely new screen. Applied instantly so nothing slides on its own.
  const keepScroll = changed ? 0 : screen.scrollTop;

  if(state.view === 'splash'){
    if(nav._html !== ''){ nav.innerHTML = ''; nav._html = ''; }
    screen.innerHTML = splashHTML();
    screen.classList.toggle('anim', changed);
    setScreenScroll(screen, 0);
    bootFromSplash();
    return;
  }

  if(state.view === 'login'){
    if(nav._html !== ''){ nav.innerHTML = ''; nav._html = ''; }
    // The sheet is its own scroller (see .auth-sheet), so carry its position
    // across the re-render the same way the screen's is carried - swapping role
    // or sign-in/register mode must not move the form under the finger.
    const keepAuth = changed ? 0 : authSheetTop(screen);
    screen.innerHTML = loginHTML();
    screen.classList.toggle('anim', changed);
    setScreenScroll(screen, keepScroll);
    setAuthSheetScroll(screen, keepAuth);
    bindLogin();
    return;
  }

  // Rebuild the nav bar only when its markup actually differs. Otherwise the
  // active pill keeps its own element and glides, instead of blinking.
  const navMarkup = navHTML();
  if(nav._html !== navMarkup){ nav.innerHTML = navMarkup; nav._html = navMarkup; }

  if(state.role==='resident'){
    screen.innerHTML = residentTabHTML();
  } else if(state.role==='provider'){
    screen.innerHTML = providerTabHTML();
  } else {
    screen.innerHTML = adminTabHTML();
  }
  screen.classList.toggle('anim', changed);
  setScreenScroll(screen, keepScroll);
  bindTabHandlers();
}

// Restores a scroll position without the smooth-scroll animation firing.
function setScreenScroll(el, top){
  const previous = el.style.scrollBehavior;
  el.style.scrollBehavior = 'auto';
  el.scrollTop = top;
  el.style.scrollBehavior = previous;
}

// The sign-in form scrolls inside its own white sheet, so that position needs
// the same care as the screen's: read it before the re-render and put it back
// after, or picking a role would snap the form back to the title (5).
function authSheetTop(el){
  const sheet = el.querySelector('.auth-sheet');
  return sheet ? sheet.scrollTop : 0;
}
function setAuthSheetScroll(el, top){
  const sheet = el.querySelector('.auth-sheet');
  if(!sheet) return;
  const previous = sheet.style.scrollBehavior;
  sheet.style.scrollBehavior = 'auto';
  sheet.scrollTop = top;
  sheet.style.scrollBehavior = previous;
}

// Typing must not re-render: a render would rebuild the input and drop the caret
// and any half-typed word (46, 79). The error clears straight off the DOM instead.
function authInput(key, el){
  state.auth[key] = el.value;
  const field = el.closest('.input-field');
  if (field) field.classList.remove('invalid');
  const msg = document.getElementById('err-' + key);
  if (msg) msg.remove();
}

function bindLogin(){
  // Both chips are drawn on every non-admin render, so one binder covers them;
  // the null guard is for a screen that has not drawn the group at all.
  const pickRole = (id, role) => {
    const node = document.getElementById(id);
    if(node) node.onclick = () => { state.role = role; render(); };
  };
  pickRole('rt-resident', 'resident');
  pickRole('rt-provider', 'provider');

  /* The console is entered from the foot of the create-account card and left by
     the tag on it — two deliberate moves, not a third role choice. */
  const adminIn = document.getElementById('rt-admin');
  if(adminIn){
    adminIn.onclick = () => { state.role = 'admin'; state.authMode = 'login'; render(); };
  }
  const adminOut = document.getElementById('rt-admin-exit');
  if(adminOut){
    adminOut.onclick = () => { state.role = 'resident'; render(); };
  }

  const toggleAuth = document.getElementById('toggle-auth-mode');
  if(toggleAuth){
    toggleAuth.onclick = () => {
      state.authMode = state.authMode === 'register' ? 'login' : 'register';
      render();
    };
  }

  const pwToggle = document.getElementById('toggle-pw-btn');
  if(pwToggle){
    pwToggle.onclick=()=>{
      state.showPassword = !state.showPassword;
      render();
    };
  }

  document.getElementById('login-btn').onclick = submitAuth;
  // A phone keyboard's action key has to do something, and on this screen the
  // only thing worth doing is the screen's primary action (38, 73).
  document.querySelectorAll('.auth-sheet input').forEach(inp => {
    inp.onkeydown = (e) => { if(e.key === 'Enter') submitAuth(); };
  });
}

// One path for the button and for Enter, so the two can never drift apart (65).
function submitAuth(){
  const btn = document.getElementById('login-btn');
  if(!btn || btn.dataset.busy) return;
  const value = (id) => { const node = document.getElementById(id); return node ? node.value.trim() : ''; };
  // Must agree with loginHTML(): the Admin route never draws the name and
  // barangay fields, so it must never demand them either.
  const isRegister = state.role !== 'admin' && state.authMode === 'register';
  const errors = {};
  if (!value('login-email')) errors.email = 'Enter your email to continue.';
  if (!value('login-pass')) errors.pass = 'Enter your password.';
  if (isRegister && !value('reg-name')) errors.name = 'Tell us who to greet.';
  if (isRegister && !value('reg-brgy')) errors.brgy = 'Your barangay decides who is nearby.';
  if (Object.keys(errors).length) {
    state.authError = errors;
    render();
    // Focus the first field, in reading order, that still needs the reader (49, 73).
    const invalid = [['reg-name','name'], ['login-email','email'], ['reg-brgy','brgy'], ['login-pass','pass']]
      .find(pair => errors[pair[1]]);
    if (invalid) document.getElementById(invalid[0]).focus();
    return;
  }
  state.authError = {};
  btn.dataset.busy = '1';
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.classList.add('btn-loading');
  btn.innerHTML = '<span class="spinner"></span> ' + (isRegister ? 'Creating account...' : 'Signing you in...');
  setTimeout(() => {
    delete btn.dataset.busy;
    btn.disabled = false;
    btn.classList.remove('btn-loading');
    btn.innerHTML = original;
    showToast(isRegister ? 'Prototype build - this account is not stored' : 'Signed in to the demo environment');
    state.view='app';
    clearProfileModals();
    if(state.role==='resident') state.tab='home';
    else if(state.role==='provider') state.tab='dashboard';
    else state.tab='admin_dashboard';
    render();
  }, 700);
}

/* One screen header, built once (11). Screens that already use it get the shared
   classes; render() decides whether the title renders large from the tab, so a
   caller never has to repeat a font size (7.2). */
function screenHeader(title, opts){
  const o = opts || {};
  const back = o.backId
    ? `<button class="back-btn" id="${o.backId}" aria-label="${o.backLabel || 'Back'}">${ic('chevron-left',18)}</button>`
    : (o.back ? `<button class="back-btn" onclick="${o.back}" aria-label="${o.backLabel || 'Back'}">${ic('chevron-left',18)}</button>` : '');
  return `<div class="topbar"><div class="hb">` + back
    + `<div><div class="title">${title}</div>${o.sub ? `<div class="sub">${o.sub}</div>` : ''}</div>`
    + `</div>${o.action || ''}</div>`;
}

/* One settings row: label, one supporting line, chevron. The resident hub, the
   provider hub and the admin account each carried their own copy of this markup,
   so they now share it (11, 65). toggle closes the section it opens. */
function settingsRow(sectionKey, id, title, detail, toggle){
  const act = toggle
    ? `state.${sectionKey}=state.${sectionKey}==='${id}'?null:'${id}'; render();`
    : `state.${sectionKey}='${id}'; render();`;
  return `<button type="button" class="job-row" onclick="${act}" aria-label="${title}: ${detail}">`
    + `<span style="min-width:0; flex:1;"><span class="jr-t">${title}</span><span class="jr-s">${detail}</span></span>`
    + `<span style="color:var(--mist); font-size:16px; line-height:1; flex-shrink:0;">›</span>`
    + `</button>`;
}

function navItem(id,icon,label,count){

  return `<button type="button" class="navitem ${active?'active':''}" data-nav="${id}"${active?' aria-current="page"':''}${count ? ' aria-label="' + label + ', ' + count + ' waiting for you"' : ''}><span class="ic">${ic(icon,19,active?'filled':undefined)}${count ? `<span class="nav-badge">${count}</span>` : ''}</span><span class="nav-label">${label}</span></button>`;

  const live = bookingsForResident().filter(b => !FINISHED_STATES.includes(b.status))
    .sort((a, b) => Date.parse(b.statusChangedAt || b.createdAt) - Date.parse(a.statusChangedAt || a.createdAt));
  const active = live[0] || null;
  const hasUnread = NOTIFICATIONS.some(n=>n.unread);

     BOOKING_STATES now. They were typed a second time here — which is how a
     stepper and a tracking card could tell the same story in different words — and
     the stepper used to stop at four steps, so en_route and arrived had no place on
     it at all (21, 65). */
  const STAGES = ['requested', 'upcoming', 'en_route', 'arrived', 'ongoing', 'completed'];
  const stageIndex = active ? STAGES.indexOf(active.status) : -1;

  const repeat = (() => {

      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));

    done.forEach(b => {
      const p = providerOf(b);

        </button>

    </div>

    <div class="catgrid">
      ${SERVICES.map(s=>{ const m = serviceMeta(s.id); return `<button type="button" class="cat" data-service="${s.id}"><span class="badge" style="background:${m.bg}; color:${m.fg};">${ic(s.icon,16)}</span><span>${esc(s.label)}</span></button>`; }).join('')}
    </div>

    ${active? `

/* These used to congratulate you and change nothing. The answer now extends what
   the resident said, and the booking sheet carries that wording across. */
function addConciergeAnswer(sortId, index) {
  const row = CONCIERGE_SORTS.find(r => r.id === sortId) || CONCIERGE_SORTS[2];
  const answer = row && row.ans && row.ans[index];
  if (!answer) return;
  const notes = state.conciergeNotes || [];
  if (!notes.includes(answer)) notes.push(answer);
  state.conciergeNotes = notes;
  repaintOnly();
  showToast('Added to what the provider will be shown');
}

function handlePhotoUpload(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  // A photo of the problem has to actually be a photo. The rejection reads from
  // the control it belongs to, and the field is cleared so the same pick can be
  // retried once the resident chooses a different file.
  if(!file.type.startsWith('image/')){
    state.conciergePhotoAttached = false;
    state.conciergePhotoName = '';
    state.conciergePhotoError = 'That is not a photo. Choose a .jpg or .png picture of the problem.';
    e.target.value = '';
    render();
    return;
  }
  state.conciergePhotoAttached = true;
  state.conciergePhotoName = file.name;
  state.conciergePhotoError = null;
  render();
}

function removeConciergePhoto(){
  state.conciergePhotoAttached = false;
  state.conciergePhotoName = '';
  state.conciergePhotoError = null;
  const input = document.getElementById('hidden-file-input');
  if(input) input.value = '';
  render();
}

function setExampleText(txt){
  state.conciergeInput = txt;
  state.conciergeError = null;
  const textarea = document.getElementById('concierge-input-field');

}

// The description is held in state as it is typed, so a re-render for any other
// reason (attaching a photo, a rejected file) cannot silently discard it.
function conciergeInput(el){
  state.conciergeInput = el.value;
  if(state.conciergeError){
    state.conciergeError = null;
    const note = document.getElementById('concierge-error');
    if(note) note.remove();
  }
}

// The prototype cannot see a fault, so it does not claim to. It reads the
// resident's own words and sorts them into one of the existing service
// categories, then asks the question a provider would need answered. Trades are
// tested in list order and matched on whole words only, so "dishwasher" cannot
// be read as a shipment and "a slight leak" cannot be read as a lighting fault.
const CONCIERGE_SORTS = [
  { id:'electrical', words:['breaker','breakers','wiring','wire','wires','socket','sockets','outlet','outlets','light','lights','fan','fans','surge','power','fuse','fuses','electric','electrical','switch','switches'],
    ask:'Does the breaker trip immediately, or only once the appliance has been running for a while?', ans:['Trips right away','Only after a while'] },
  { id:'appliance',  words:['refrigerator','fridge','washer','washing','dryer','freezer','oven','microwave','aircon','conditioner','dispenser','dishwasher','appliance','appliances'],
    ask:'What brand and model is the unit, and does it make any noise or smell when it runs?', ans:['Runs quietly','Noisy or smells'] },
  { id:'plumbing',   words:['leak','leaks','leaking','drip','drips','dripping','pipe','pipes','faucet','faucets','tap','taps','sink','sinks','toilet','toilets','drain','drains','water','clog','clogged','septic','flood','flooding','shower'],
    ask:'Is the water leaking continuously, or only when the faucet valve is open?', ans:['Leaks continuously','Only when open'] },
  { id:'cleaning',   words:['clean','cleans','cleaning','cleaner','sweep','sweeping','mop','mopping','laundry','housekeeping','sanitize','wash','washing','scrub','pest','pests','roach','roaches','gutter','gutters','yard'],
    ask:'Is this a one-time deep clean, or a recurring schedule you want set up?', ans:['One-time deep clean','Recurring'] },
  { id:'tutoring',   words:['tutor','tutors','tutoring','lesson','lessons','school','homework','review','math','english','science','coach','grade','grades','tutorial'],
    ask:'What grade level and subject should the sessions cover?', ans:['One subject','Several subjects'] },
  { id:'delivery',   words:['deliver','delivers','delivery','haul','hauling','truck','transfer','furniture','cargo','package','packages','moving'],
    ask:'What is being moved, and is there someone at both ends to help load and unload?', ans:['Help at both ends','No help available'] },
];

function matchConciergeService(text){
  const t = (text || '').toLowerCase();
  const hit = CONCIERGE_SORTS.find(s => {
    s._re = s._re || new RegExp('(^|[^a-z0-9])(' + s.words.join('|') + ')([^a-z0-9]|$)');
    return s._re.test(t);
  });
  return hit || CONCIERGE_SORTS[2];
}

/* Which pair the open room is about — read from state, because a provider
   answering one customer must not be shown another customer's thread. */
function currentThreadKey(){
  const other = state.activeChatCounterpart || state.activeChatProvider || PROVIDERS[0];
  const customer = state.activeChatCustomerId || CURRENT_CUSTOMER_ID;
  const provider = other.serviceId ? other.id : (state.activeChatProviderId || (PROVIDERS[0]||{}).id);
  return threadKeyOf(customer, provider);
}

function markThreadRead(){
  const read = Object.assign({}, state.threadRead);
  read[currentThreadKey()] = Date.now();
  state.threadRead = read;
}

function closeChatRoom(){
  state.isChatOpen = false;
  state.activeChatCounterpart = null;
  render();
}

/* One way into the room for every entry point, so the thread, the job it belongs
   to and the read marker can never be set three different ways. Either side can
   open it: coordination happens on the job, but the conversation lives here. */
function openChatThread(counterpartId, bookingId){
  const b = bookingId ? bookingById(bookingId) : null;
  const other = PROVIDERS.find(x => x.id === counterpartId) || CUSTOMERS.find(c => c.id === counterpartId);
  if (!other) return;
  const providerRecord = other.serviceId ? other : (b ? PROVIDERS.find(p => p.id === b.providerId) : null);
  state.activeChatCounterpart = other;
  state.activeChatProvider = providerRecord || PROVIDERS[0];
  state.activeChatProviderId = providerRecord ? providerRecord.id : null;
  state.activeChatBookingId = b ? b.id : null;
  state.activeChatCustomerId = b ? b.customerId : (other.serviceId ? CURRENT_CUSTOMER_ID : other.id);
  state.tab = 'messages';
  state.isChatOpen = true;
  markThreadRead();
  render();
}

/* Alignment says who spoke; the text is escaped because it came from typing. */
function chatBubble(m, other){
  const mine = m.from === (state.role === 'provider' ? 'provider' : 'customer');
  return `<div class="chat-row ${mine ? 'chat-out' : 'chat-in'}">
      ${mine ? '' : `<span class="chat-avatar">${other && other.serviceId ? serviceAvatar(other, 34) : photoAvatar('customer', 34)}</span>`}
      <div class="chat-bubble ${mine ? 'chat-bubble-out' : 'chat-bubble-in'}">${esc(m.text)}
        <span class="chat-when">${esc(agoText(m.at))}</span></div>
    </div>`;
}

function residentChatRoom(){

  return `

// Booking lifecycle -> one tint/ink pair, used by every list and detail screen so
// "ongoing" cannot be green here and white there (AGENTS.md 65, 77). Text stays the
// primary signal; color is reinforcement only (34).
function statusColors(status){
  if(status === 'upcoming' || status === 'en_route' || status === 'arrived')
    return {bg:'var(--warning-100)', fg:'var(--warning-ink)'};
  if(status === 'expired' || status === 'no_show')
    return {bg:'var(--background)', fg:'var(--text-muted)'};
  if(status === 'completed') return {bg:'var(--success-100)', fg:'var(--success-ink)'};
  if(status === 'cancelled') return {bg:'var(--error-100)',   fg:'var(--error-ink)'};
  // Nothing has been agreed yet, so a request does not take the active blue that
  // "ongoing" means. Same treatment as .status-requested so one status cannot be
  // quiet on Home and loud in the list.
  if(status === 'requested') return {bg:'var(--background)',  fg:'var(--ink-soft)'};
  return {bg:'var(--brand-tint-soft)', fg:'var(--brand-primary)'};
}

// below drive overlays, sub-screens and in-progress UI, and nothing used to
// reset them: anything left open came back on the next sign-in (the log-out
// dialog did exactly that; a left-open chat, a provider/booking detail or a
// locked admin session could do the same).
function clearProfileModals(){
  clearModals();

  state.isChatOpen = false;

  state.activeChatCounterpart = null;
  state.activeChatProviderId = null;

  state.selectedVerificationId = null;
  state.selectedAdminProvider = null;
  state.adminProviderMenu = null;
  state.adminCredentialProvider = null;
  // in-progress editing, Concierge draft, admin session lock
  state.conciergePhotoAttached = false;
  state.conciergePhotoName = '';
  state.conciergeAnalyzed = false;
  state.conciergeAnalyzing = false;
  state.conciergeInput = '';
  state.conciergeServiceId = null;
  state.conciergePhotoError = null;
  state.conciergeError = null;
// sub-screen + filter state back to its defaults
  state.residentProfileSection = null;
  state.adminAccountSection = null;
  state.providerProfileSection = null;
  state.adminScreen = 'overview';
  state.adminProviderSection = 'overview';
  state.bookingFilter = 'all';
  state.providerBookingFilter = 'all';
  // discovery filters belong to the session, not to the person
  state.providerFilters = blankFilters();
  state.searching = false;
  state.sheet = null;
  state.requestDraft = null;
  state.requestSubmitting = false;
  state.requestError = null;

// One sign-out path for all three roles. Every Log Out control calls this so a
// session can never end with a role, tab or overlay left over from the previous
// user - each screen used to carry its own inline reset sequence, and the ones
// that omitted role/tab are what let a dialog survive into the next session.
function signOut(){
  clearProfileModals();
  state.view = 'login';
  state.authMode = 'login';
  state.showPassword = false;
  // The next person to use this device should get an empty form, not whatever
  // the previous session typed; the sample credential is one tap away (78).
  state.auth = {email:null, pass:null, name:null, brgy:null};
  state.authError = {};
  state.role = 'resident';
  state.tab = 'home';
  render();
}
function residentProfileAction(action){
  state.residentProfileModal = action;
  render();
}

function saveResidentProfile(){

  const barangay = document.getElementById('resident-profile-barangay');

  if(name) state.profileData.name = name.value.trim() || state.profileData.name;
  if(phone) state.profileData.phone = phone.value.trim() || state.profileData.phone;
  if(address) state.profileData.address = address.value.trim() || state.profileData.address;
  if(barangay) state.profileData.barangay = barangay.value.trim() || state.profileData.barangay;

  persist();
  state.residentProfileModal = 'saved';
  render();
}

function intelligenceStats(f) {
  const since = f.days ? Date.now() - f.days * 86400000 : 0;
  const inWindow = BOOKINGS.filter(b => Date.parse(b.createdAt) >= since &&
    (f.category === 'all' || providerOf(b).serviceId === f.category));
  const completed = inWindow.filter(b => b.status === 'completed');
  const closed = inWindow.filter(b => FINISHED_STATES.includes(b.status) && b.status !== 'disputed');
  const byCategory = SERVICES.map(cat => {
    const rows = completed.filter(b => providerOf(b).serviceId === cat.id);
    return { id: cat.id, label: cat.label, jobs: rows.length,
             centavos: rows.reduce((t, b) => t + (b.pricing ? b.pricing.baseCentavos : b.amountCentavos), 0) };
  }).filter(r => r.jobs).sort((a, b) => b.centavos - a.centavos);
  return {
    grossCentavos: byCategory.reduce((t, r) => t + r.centavos, 0),
    bookings: inWindow.length,
    completed: completed.length,
    completionRate: closed.length ? Math.round(completed.length / closed.length * 100) : 0,
    byCategory
  };
}
function supplyGaps(f) {
  return SERVICES.filter(cat => f.category === 'all' || cat.id === f.category).map(cat => ({
    id: cat.id, label: cat.label,
    supply: PROVIDERS.filter(p => p.serviceId === cat.id).length,
    demand: BOOKINGS.filter(b => providerOf(b).serviceId === cat.id).length
  })).filter(r => r.demand > 0 && r.supply <= 1);
}

w Provider</button><button class="btn sm secondary" onclick="state.adminProviderCategory='credentials'; state.adminCredentialProvider='${provider.id}'; render();">View Credentials</button><button class="btn sm secondary" onclick="openAdminProviderProfile('${provider.id}'); state.adminProviderSection='bookings';">View Bookings</button><button class="btn sm secondary" onclick="openAdminProviderProfile('${provider.id}'); state.adminProviderSection='reviews';">View Reviews &amp; Complaints</button></div>` : ''}</div>`; }).join('') || '<div class="card" style="text-align:center; color:var(--mist);">No verified providers match these filters.</div>'}

function openProviderVerification(id){
  const sameApplication = state.selectedVerificationId === id;
  state.selectedVerificationId = id;
  state.verificationModal = null;
  if(!sameApplication) {
    state.verificationStatus = 'Pending Review';
    state.verificationNote = '';
    state.verificationActivity = [];
  }
  state.tab = 'verification_review';
  if(!state.verificationActivity.length) state.verificationActivity = ['Sep 8, 9:14 AM - Application submitted','Sep 8, 9:15 AM - Email verified','Sep 8, 9:16 AM - Mobile number verified','Sep 8, 9:17 AM - Government ID uploaded','Sep 8, 9:20 AM - TESDA credential uploaded','Sep 8, 9:22 AM - Barangay Clearance uploaded'];
  render();
}

function verificationAction(action, value){
  if(action === 'document') state.verificationModal = 'document';
  if(action === 'request') state.verificationModal = 'request';
  if(action === 'flag') state.verificationModal = 'flag';
  if(action === 'reject') state.verificationModal = 'reject';
  if(action === 'note') { state.verificationNote = value || 'Internal review note saved.'; state.verificationActivity.push('Sep 9, 2:35 PM - Internal review note added'); state.verificationModal = 'note_saved'; }
  if(action === 'request_sent') { state.verificationStatus = 'Update Requested'; state.verificationActivity.push('Sep 9, 2:40 PM - NBI Clearance requested by Administrator'); state.verificationModal = 'request_sent'; }
  if(action === 'approve_confirm') { state.verificationModal = 'approve_confirm'; }
  if(action === 'approved') { state.verificationStatus = 'Verified'; state.verificationModal = 'approved'; state.verificationActivity.push('Sep 9, 2:45 PM - Provider approved by Administrator'); }
  if(action === 'rejected') { state.verificationStatus = 'Rejected'; state.verificationModal = 'rejected'; state.verificationActivity.push('Sep 9, 2:45 PM - Application rejected by Administrator'); }
  render();
}

ct id="reject-reason" aria-label="Reason for rejecting this application" style="width:100%; padding:9px; border:1px solid var(--line); border-radius:8px;"><option>Invalid required document</option><option>Unable to verify identity</option><option>Required qualification not met</option><option>Other</option></select><textarea aria-label="Reason for rejecting this application" placeholder="Administrator notes..." style="width:100%; min-height:70px; margin-top:10px; padding:8px; border:1px solid var(--line); border-radius:8px; font:inherit;"></textarea><button class="btn danger btn-block" style="margin-top:10px;" onclick="verificationAction('rejected')">Confirm Rejection</button>` : `<div style="font-size:12px; color:var(--ink-soft); line-height:1.5; margin:12px 0;">${modal === 'approved' ? `${app.name} has been successfully verified.` : modal === 'rejected' ? `${app.name} remains in the application record with a rejection reason.` : `${app.name} has been notified about the required verification update.`}</div><button class="btn" style="width:100%;" onclick="state.verificationModal=null; render();">Close</button>`}</div></div>` : ''}`;

/* ── provider-side views built on the kernel ─────────────────────────────── */

/* The forward moves for this job, taken from the machine rather than typed into
   the card, so a button can only appear when the transition table allows it. */
/* The verb for each forward move, named once and outside the card. Without it a
   button falls back to the name of the state it produces, and a provider is
   offered "Accepted" or "Under review" as though reading a status were an
   action (40, 85). */
const JOB_VERBS = {
  upcoming:'Accept this request', en_route:'On the way', arrived:'I have arrived',
  ongoing:'Start the work', completed:'Mark complete', no_show:'No one is here',
  cancelled:'Decline this request', disputed:'Something went wrong with this job'
};

function jobActionBar(b) {
  const options = nextActionFor(b, 'provider');
  if (!options.length) return '';
  /* Every verb acts on its own, except a case: that needs a reason from a
     person before the status may move, so it opens the form instead. */
  const act = (to) => to === 'disputed' ? `openCaseSheet('${b.id}')` : `providerJobAction('${b.id}','${to}')`;
  return `<div class="card card-lg">
      <div style="font-size:var(--t-caption); font-weight:800; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;">Your next step</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${options.filter(o => o !== 'cancelled').map((o, i) => `
          <button type="button" class="btn ${i === 0 ? '' : 'secondary'}" style="width:100%; border-radius:12px;" onclick="${act(o)}">${JOB_VERBS[o] || label(o)}</button>`).join('')}
      </div>
      <div style="font-size:var(--t-caption); color:var(--mist); margin-top:10px; line-height:1.5;">
        ${b.status === 'ongoing'
          ? 'Marking it complete is what releases the payment and starts the record. The client still confirms it.'
          : 'The client sees each step the moment you press it.'}
      </div>
    </div>`;
}

/* What the provider has earned, when it is coming, and what they owe us on cash
   work. This replaces the stored-value wallet the prototype shipped with: there
   is no balance to spend and no cash-out to press, only an accounting position
   the platform settles on schedule. */
function earningsCard(providerId) {
  const bal = providerBalances(providerId);
  const st = providerStatement(providerId);
  const owed = commissionReceivableAgeing().find(r => r.providerId === providerId);
  return `<div class="card card-lg">
      <div class="row" style="margin-bottom:12px;">
        <b class="card-title">Earnings and payouts</b>
        <span class="chip">${esc(CONFIG.payoutSchedule === 'weekly:monday' ? 'Weekly, Monday' : CONFIG.payoutSchedule)}</span>
      </div>
      <div class="statgrid" style="margin:0 0 12px;">
        <div class="stat"><div class="num">${pesoShort(bal.availableCentavos)}</div><div class="lbl">Ready to pay out</div></div>
        <div class="stat"><div class="num">${pesoShort(bal.pendingCentavos)}</div><div class="lbl">In the ${CONFIG.payoutHoldDays}-day hold</div></div>
      </div>
      <div class="row"><span>Collected on site, yours already</span><b>${peso(bal.collectedOnSiteCentavos)}</b></div>
      <div class="row"><span>Fee owed on those cash jobs</span><b style="color:${bal.commissionOwedCentavos ? 'var(--warning-ink)' : 'var(--ink-soft)'}">${peso(bal.commissionOwedCentavos || 0)}</b></div>
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px; margin-top:4px;">
        <span style="font-weight:800; color:var(--ink);">Next payout</span>
        <b>${bal.availableCentavos >= bal.payoutMinCentavos ? 'Mon, ' + esc(bal.nextPayoutOn.replace(/^[^,]*, /, '')) : 'needs ' + pesoShort(bal.payoutMinCentavos - bal.availableCentavos) + ' more'}</b>
      </div>
      <p style="font-size:var(--t-caption); color:var(--mist); line-height:1.55; margin:10px 0 0;">
        ${bal.disputedCentavos
          ? peso(bal.disputedCentavos) + ' of this is held while a case is open. Nothing is decided by holding it.'
          : 'A job becomes payable once the client confirms it and the hold window has passed — long enough for a warranty call to reach you instead of a dispute.'}
        ${owed ? ' Cash you collected is never paid out again; the fee on it is simply settled against your next transfer.' : ''}
      </p>
      ${PAYOUTS.filter(p => p.providerId === providerId).length ? `
      <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line);">
        <div style="font-size:var(--t-caption); font-weight:800; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;">Paid out</div>
        ${PAYOUTS.filter(p => p.providerId === providerId).slice(0, 4).map(p => `
          <div class="row" style="font-size:var(--t-caption);"><span>${esc(String(p.createdAt).slice(0, 10))} · ${esc(p.method)} ${esc(p.destination)}</span><b>${peso(p.amountCentavos)}</b></div>`).join('')}
      </div>` : ''}
    </div>`;
}

/* A price list the provider can actually change. */
function listingsPanel(providerId) {
  const list = listingsOf(providerId);
  return `<div class="card card-lg">
      <div class="row" style="margin-bottom:10px;">
        <b class="card-title">Services and prices</b>
        <span class="chip">${list.length} listed</span>
      </div>
      ${list.length ? list.map(l => `
        <div class="row" style="padding:9px 0; border-top:1px solid var(--line);">
          <span style="min-width:0; flex:1;">
            <span style="display:block; font-size:12.5px; font-weight:700; color:var(--ink);">${esc(l.title)}</span>
            <span style="display:block; font-size:var(--t-caption); color:var(--mist); margin-top:1px;">${l.durationMin} min · fee to Sukinnect ${pesoShort(computeBreakdown({ baseCentavos: l.basePriceCentavos, categoryId: l.categoryId, inclusions: [] }).commissionCentavos)}</span>
          </span>
          <span style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
            <b style="font-size:13px;">${pesoShort(l.basePriceCentavos)}</b>
            <button type="button" class="chip" style="cursor:pointer;" aria-pressed="${l.isActive}" onclick="toggleListing('${l.id}')">${l.isActive ? 'Active' : 'Hidden'}</button>
            <button type="button" class="chip" style="cursor:pointer;" onclick="editListing('${l.id}')">Edit</button>
          </span>
        </div>`).join('') : `<div style="font-size:var(--t-caption); color:var(--mist);">Nothing listed yet. A provider with no listed job cannot be booked for a price.</div>`}
      <button type="button" class="btn sm secondary" style="width:100%; margin-top:12px; border-radius:10px;" onclick="providerProfileAction('add_service')">${ic('check', 12)} Add a service</button>
    </div>`;
}

function toggleListing(id) {
  const l = listingById(id);
  if (!l) return;
  l.isActive = !l.isActive;
  persist();
  render();
  showToast(l.title + ' is now ' + (l.isActive ? 'bookable' : 'hidden from search'));
}
function editListing(id) {
  const l = listingById(id);
  if (!l) return;
  state.listingDraft = { id: l.id, title: l.title, pricePesos: toPesos(l.basePriceCentavos), durationMin: l.durationMin };
  providerProfileAction('edit_service');
}
function saveListingDraft() {
  const draft = state.listingDraft;
  if (!draft) return;
  const title = String(draft.title || '').trim();
  const price = toCentavos(Number(draft.pricePesos));
  const mins = Math.round(Number(draft.durationMin) || 0);
  if (title.length < 3) { state.profileError = 'Give the service a name a client would recognise.'; render(); return; }
  if (!Number.isFinite(price) || price < 10000) { state.profileError = 'A job price has to be at least ₱100.'; render(); return; }
  if (mins < 5) { state.profileError = 'Say how long the job takes, in minutes.'; render(); return; }
  const existing = listingById(draft.id);
  if (existing) {
    existing.title = title; existing.basePriceCentavos = price; existing.durationMin = mins;
  } else {
    LISTINGS.push({ id: 'l' + (LISTINGS.length + 1), providerId: CURRENT_PROVIDER_ID,
                    categoryId: providerOf({ providerId: CURRENT_PROVIDER_ID }).serviceId,
                    title, basePriceCentavos: price, durationMin: mins, isActive: true });

}

/* Threads belong to a job, and a job has two sides. The provider was reading the
   resident's inbox, including conversations that were not theirs. */
function threadsFor(role) {
  const mine = role === 'provider' ? bookingsForProvider() : bookingsForResident();
  const seen = {};
  mine.forEach(b => {
    const other = role === 'provider' ? customerOf(b) : providerOf(b);
    if (!other || seen[other.id]) return;
    const key = threadKeyOf(b.customerId, b.providerId);
    const messages = threadMessages(key);
    const mineSide = role === 'provider' ? 'provider' : 'customer';
    const readAt = (state.threadRead || {})[key];
    /* Unread is about messages, not about a job's status. The list used to claim
       an unread dot because a booking was "ongoing", which had nothing to do with
       anyone having written anything. */
    const unseen = messages.filter(m => m.from !== mineSide && (!readAt || Date.parse(m.at) > readAt));
    const last = messages.length ? messages[messages.length - 1] : null;
    const shown = last || { text: b.request || b.summary, at: b.statusChangedAt || b.createdAt };
    seen[other.id] = {
      id: other.id,
      kind: role === 'provider' ? 'customer' : 'provider',
      name: other.name,
      service: role === 'provider' ? 'Client' : (other.service || 'Resident'),
      barangay: b.barangay,
      snippet: shown.text.length > 46 ? shown.text.slice(0, 46) + '…' : shown.text,
      time: agoText(shown.at),
      unread: unseen.length > 0,
      unseen: unseen.length,
      bookingId: b.id
    };
  });
  return Object.keys(seen).map(k => seen[k]);
}

/* The dashboard's "booked this week" was a typed number. It is now the sum of the
   jobs actually held for this week. */
function bookedThisWeek(providerId) {
  const since = Date.now() - 7 * 86400000;
  return bookingsForProvider().filter(b => Date.parse(b.createdAt) >= since)
    .reduce((t, b) => t + (b.amountCentavos || 0), 0);
}
function completionRate(providerId) {
  const closed = bookingsForProvider().filter(b => ['completed', 'cancelled', 'expired', 'no_show'].includes(b.status));
  if (!closed.length) return 0;
  return Math.round(closed.filter(b => b.status === 'completed').length / closed.length * 100);
}

// A request is not a booking yet: nothing is scheduled and no fee is agreed
// until this account answers it. One source for the queue, so the nav badge,
// the rail and the dashboard cannot disagree about how many are waiting.
function pendingProviderRequests(){
  return bookingsForProvider().filter(b => b.status === 'requested');
}

// The pin marks the client's door, so it only mounts for a job this account
// actually took. Requests and closed records stay at barangay level (56).
function initProviderBookingMap(booking){
  const mapEl = document.getElementById('provider-booking-map');
  if(!mapEl || !booking) return;
  const map = L.map('provider-booking-map').setView([booking.lat, booking.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  L.marker([booking.lat, booking.lng]).addTo(map).bindPopup(booking.address).openPopup();
}

function findProviderBooking(bookingId){
  return bookingsForProvider().find(b => b.id === bookingId) || null;
}

// One entry point for the provider's booking screen so the map set-up and the
// per-request prompts live in one place instead of being re-typed per call site.
function openProviderBooking(bookingId){
  state.selectedProviderBookingId = bookingId;
  // A decline prompt belongs to one request; it must not follow you to the next.
  state.providerDeclineConfirm = false;
  state.tab = 'provider_booking_detail';
  render();
  setTimeout(() => initProviderBookingMap(findProviderBooking(bookingId)), 100);
}

// The write is deferred so the control can show what it is doing (47) and so a
// second tap cannot answer the same request twice.
function answerRequest(bookingId, action){
  const b = findProviderBooking(bookingId);
  if(!b || b.status !== 'requested' || state.providerResponding) return;
  state.providerResponding = { id: bookingId, action: action };
  render();
  setTimeout(() => {
    // The prompt stays on screen while the answer is in flight, so the spinner
    // replaces the buttons the user just pressed rather than a different card.
    state.providerResponding = null;
    state.providerDeclineConfirm = false;
    if(action === 'accept'){
      try {
        attemptTransition(b.id, 'upcoming', { role:'provider', id: CURRENT_PROVIDER_ID, name: providerOf(b).name });
      } catch (err) { render(); showToast(err.message, 'error'); return; }
      showToast('Accepted - ' + customerOf(b).name + ' is notified and ' + b.date + ', ' + b.time + ' is held for you');
      render();
      // Accepting is what unlocks the door: the screen now carries a live map, so
      // it has to be mounted for the booking that just appeared in the DOM.
      setTimeout(() => initProviderBookingMap(b), 100);
      return;
    }
    try {
      attemptTransition(b.id, 'cancelled', { role:'provider', id: CURRENT_PROVIDER_ID },
                        { reason:'Declined by you' });
    } catch (err) { render(); showToast(err.message, 'error'); return; }
    showToast('Declined - ' + customerOf(b).name + ' can now look for another provider');
    render();
  }, 750);
}

      </div>
      <div style="font-size:var(--t-caption); color:var(--mist); margin-top:7px;">Confirm the scope and final price with the client before you start.</div>

    </div>`;
}

function providerBookings(){
  const filter = state.providerBookingFilter || 'all';
  const waiting = pendingProviderRequests().length;
  const filtered = bookingsForProvider().filter(b => filter === 'all' || b.status === filter);
  return `
  <div class="topbar"><div class="hb"><div><div class="title">Bookings</div><div class="sub">${waiting ? waiting + ' request' + (waiting === 1 ? '' : 's') + ' waiting on your answer' : 'Nothing waiting on your answer'}</div></div></div></div>
  <div class="pad" style="background:var(--cloud); padding-bottom:40px;">
    <div class="seg hscroll" style="margin-bottom:16px;">
      ${['all','requested','upcoming','en_route','arrived','ongoing','completed','cancelled'].map(status => `
        <button class="seg-btn ${filter === status ? 'on' : ''}"${status === 'requested' && waiting ? ' aria-label="Requested, ' + waiting + ' waiting for you"' : ''} onclick="state.providerBookingFilter='${status}'; render();">${status === 'all' ? 'All' : label(status)}${status === 'requested' && waiting ? ' (' + waiting + ')' : ''}</button>
      `).join('')}

    ${filtered.length === 0 ? bookingListEmpty(filter, 'provider') : filtered.map(b => `

              <div style="font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.3;">${esc(b.summary)}</div>

function bindTabHandlers(){
  if(state.role === 'resident' && state.tab === 'profile'){
    const residentEditButtons = Array.from(document.querySelectorAll('button')).filter(button => button.textContent.trim() === 'Edit Profile');
    residentEditButtons.slice(0, -1).forEach(button => button.remove());
  }
  if(state.role === 'admin' && state.tab === 'profile' && state.adminAccountSection){
    const sectionTitles = {'account':'ACCOUNT INFORMATION','role':'ROLE & ACCESS','security':'SECURITY & SIGN-IN','sessions':'ACTIVE SESSIONS','login_activity':'LOGIN ACTIVITY','notifications':'NOTIFICATIONS','preferences':'APP PREFERENCES','activity':'MY ADMIN ACTIVITY'};
    const title = sectionTitles[state.adminAccountSection];
    const matchingCards = Array.from(document.querySelectorAll('.screen .pad > .card')).filter(card => card.textContent.includes(title));
    matchingCards.slice(1).forEach(card => card.remove());
  }
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=()=>{
      // Entering a tab from the navigation always starts clean: an overlay left
      // flagged by the previous screen must not be waiting there for the user.
      clearModals();
      state.tab=el.dataset.nav;
      render();
    };
  });

  document.querySelectorAll('[data-provider-booking-id]').forEach(el => {
    el.onclick = () => openProviderBooking(el.dataset.providerBookingId);
  });

  // The provider's answer to a request. Both controls are bound to the booking
  // currently on screen, so a stale id from a previous detail view cannot be
  // answered by accident.
  const acceptRequestBtn = document.getElementById('accept-request-btn');
  if(acceptRequestBtn) acceptRequestBtn.onclick = () => answerRequest(state.selectedProviderBookingId, 'accept');
  const declineRequestBtn = document.getElementById('decline-request-btn');
  if(declineRequestBtn) declineRequestBtn.onclick = () => { state.providerDeclineConfirm = true; render(); };
  const keepRequestBtn = document.getElementById('keep-request-btn');
  if(keepRequestBtn) keepRequestBtn.onclick = () => { state.providerDeclineConfirm = false; render(); };
  const confirmDeclineBtn = document.getElementById('confirm-decline-btn');
  if(confirmDeclineBtn) confirmDeclineBtn.onclick = () => answerRequest(state.selectedProviderBookingId, 'decline');

  document.querySelectorAll('[data-provider-detail]').forEach(el => {
    el.onclick = () => openProviderDetail(el.dataset.providerDetail, 'results');
  });

  // Home advertises three shortcuts with cursor:pointer; each now goes where its
  // label claims instead of sitting inert.
  document.querySelectorAll('[data-service]').forEach(el => {
    el.onclick = () => openCategory(el.dataset.service);
  });
  document.querySelectorAll('[data-booking]').forEach(el => {
    el.onclick = () => openBookingDetail(el.dataset.booking);
  });
  document.querySelectorAll('[data-provider]').forEach(el => {
    el.onclick = () => openProviderDetail(el.dataset.provider, 'home');
  });
  document.querySelectorAll('[data-notif]').forEach(el => {
    el.onclick = () => openNotification(el.dataset.notif);
  });
  document.querySelectorAll('[data-rate]').forEach(el => {
    el.onclick = () => setBookingRating(state.selectedBookingId, Number(el.dataset.rate));
  });
  const changeRatingBtn = document.getElementById('change-rating-btn');
  if(changeRatingBtn) changeRatingBtn.onclick = () => changeBookingRating(state.selectedBookingId);

  const chatProBtn = document.querySelector('[data-chat-booking-provider-id]');
  if(chatProBtn){
    chatProBtn.onclick = () => openChatThread(chatProBtn.dataset.chatBookingProviderId, state.selectedBookingId);
  }

  const chatInquiriesBtn = document.querySelector('[data-chat-provider-id]');
  if(chatInquiriesBtn){
    chatInquiriesBtn.onclick = () => openChatThread(chatInquiriesBtn.dataset.chatProviderId, state.selectedProviderBookingId);
  }

  document.querySelectorAll('[data-open-chat-id]').forEach(el => {
    el.onclick = () => openChatThread(el.dataset.openChatId, el.dataset.threadBooking);
  });

  const conciergeAnalyzeBtn = document.getElementById('concierge-analyze-btn');
  if(conciergeAnalyzeBtn){
    conciergeAnalyzeBtn.onclick = () => {
      if(state.conciergeAnalyzing) return;
      const field = document.getElementById('concierge-input-field');
      const text = (field ? field.value : state.conciergeInput || '').trim();
      state.conciergeInput = text;
      // The briefing is built from what the resident supplied, so an empty
      // request has nothing to work from and says so instead of inventing one.
      if(!text && !state.conciergePhotoAttached){
        state.conciergeError = 'Describe the problem or attach a photo first - the briefing needs something to work from.';
        render();
        return;
      }
      state.conciergeError = null;
      // Capture the category now, from the words supplied at this moment.
      state.conciergeServiceId = matchConciergeService(text).id;
      state.conciergeAnalyzing = true;
      render();
      setTimeout(() => {
        state.conciergeAnalyzing = false;
        state.conciergeAnalyzed = true;
        render();
        showToast('Briefing ready - shortlisted under ' + serviceMeta(state.conciergeServiceId).label.toLowerCase());
      }, 1400);
    };
  }

  const backHomeFromNotifs=document.getElementById('back-home-from-notifs');
  const openNotifsBtn=document.getElementById('open-notifs-btn');
  if(openNotifsBtn) openNotifsBtn.onclick=()=>{state.tab='notifications';render();};
  const markAllNotifsBtn=document.getElementById('mark-all-notifs-btn');
  if(markAllNotifsBtn) markAllNotifsBtn.onclick=()=>{NOTIFICATIONS.forEach(notification=>notification.unread=false); render(); showToast('All notifications marked as read');};
  if(backHomeFromNotifs) backHomeFromNotifs.onclick=()=>{state.tab='home';render();};

  const backFromDetailBtn=document.getElementById('back-from-detail-btn');
  if(backFromDetailBtn) backFromDetailBtn.onclick=()=>{state.tab=state.previousTab;render();};

  const backHome=document.getElementById('back-home-btn');
  if(backHome) backHome.onclick=()=>{state.tab='home';render();};

  const openConciergeBtn=document.getElementById('open-concierge-btn');
  if(openConciergeBtn) openConciergeBtn.onclick=()=>{state.tab='concierge';render();};

  const backFromConciergeBtn=document.getElementById('back-from-concierge-btn');
  if(backFromConciergeBtn) backFromConciergeBtn.onclick=()=>{state.tab='home';render();};

  const searchBtn = document.getElementById('search-btn');
  const searchInput = document.getElementById('search-input');
  if(searchBtn && searchInput){
    searchBtn.disabled = state.searching;
    searchBtn.onclick = () => startDiscovery(searchInput.value);
  }
  // On a phone the keyboard's search key sends Enter, so submitting from the
  // field has to work the same as tapping the magnifier.
  if(searchInput) searchInput.onkeydown = (e) => {
    if(e.key === 'Enter') startDiscovery(searchInput.value);
  };

  // Every empty-state exit binds from this one table: an empty list that offers
  // a way out has to actually deliver it, on whichever screen raised it.
  const EMPTY_EXITS = {
    'clear-search-btn': clearDiscovery,
    'msgs-show-all-btn': () => { state.msgFilter = 'all'; render(); },
    // Both booking rails share this exit; each role only reads its own filter,
    // so resetting both costs nothing.
    'bookings-show-all-btn': () => { state.bookingFilter = 'all'; state.providerBookingFilter = 'all'; render(); },
    'bookings-find-btn': () => { state.tab = 'results'; render(); },
    'bookings-open-fsm-btn': () => { state.tab = 'fsm'; render(); },
  };
  Object.keys(EMPTY_EXITS).forEach(id => {
    const el = document.getElementById(id);
    if(el) el.onclick = EMPTY_EXITS[id];
  });

  const chatMsgList = document.getElementById('chat-msg-list');
  if(chatMsgList) chatMsgList.scrollTop = chatMsgList.scrollHeight;
  const chatInputField = document.getElementById('chat-input');
  if(chatInputField){
    chatInputField.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') sendChatMessage();
    });
  }
}

hydrate();
seedHistoricalLedger();
seedStatusHistory();
seedMessages();
seedDemoDispute();
applyDueTransitions();
render();
</script>
</body>
</html>
