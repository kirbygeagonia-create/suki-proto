];
function listingsOf(providerId) { return LISTINGS.filter(l => l.providerId === providerId); }
function listingById(id) { return LISTINGS.find(l => l.id === id) || null; }
function defaultListingFor(providerId) { return listingsOf(providerId).find(l => l.isActive) || null; }

/* ---- platform configuration -------------------------------------------------
   Every figure the deck offers as a pilot assumption lives here, editable, and
   none of it is typed into a screen. The deck says launch monetization must not
   be assumed, so the default carries its worked example (₱800 × 10 %) and the
   admin UI labels it an assumption rather than a rate in force. VAT is 0 because
   VAT registration in the Philippines turns on roughly ₱3M of gross sales, which
   this marketplace has not reached: modelling the field is honest, setting a rate
   would be inventing a compliance position.
   --------------------------------------------------------------------------- */
const CONFIG_DEFAULTS = {
  commissionRateDefault: 0.10,
  commissionRateByCategory: {},          /* per-category overrides, set by admin */
  fixedFeeCentavos: 0,                   /* booking or processing fee, ₱0 at pilot */
  taxRate: 0,                            /* applies to the platform fee only */
  cancellationFeeBeforeAcceptCentavos: 0,
  cancellationFeeAfterAcceptCentavos: 5000,
  payoutMinCentavos: 50000,
  payoutHoldDays: 7,
  payoutSchedule: 'weekly:monday',
  acceptTtlMinutes: 30,
  autoCompleteHours: 24,
  warrantyDays: 7
};
let CONFIG = Object.assign({}, CONFIG_DEFAULTS);
const CONFIG_AUDIT = [];

function setConfig(patch, actor) {
  const changed = [];
  Object.keys(patch).forEach(key => {
    if (!(key in CONFIG_DEFAULTS)) throw new Error('unknown configuration key: ' + key);
    if (CONFIG[key] === patch[key]) return;
    const entry = { key, from: CONFIG[key], to: patch[key],
                    at: new Date().toISOString(), actor: (actor && actor.role) || 'admin' };
    /* A rate change alters the money on jobs that have not been booked yet, so
       the change itself is a record. History is never rewritten to match. */
    CONFIG_AUDIT.push(entry);
    changed.push(entry);
    CONFIG[key] = patch[key];
  });
  persist();
  return changed;
}

/* ---- the accounts ------------------------------------------------------------
   Eight leaves: enough to tell the truth about this marketplace, small enough to
   hold in your head. There is deliberately no resident-side balance — money a
   customer has paid is an obligation to deliver or refund, never a number they
   can spend (AGENTS.md 23).
   --------------------------------------------------------------------------- */
const ACCOUNTS = {
  escrow_held:                { kind: 'asset',     scope: null,       label: 'Funds held by the payment partner' },
  commission_receivable:      { kind: 'asset',     scope: 'provider', label: 'Commission owed by cash-settled providers' },
  customer_deposit:           { kind: 'liability', scope: 'booking',  label: 'Paid for a job not yet delivered' },
  provider_payable:           { kind: 'liability', scope: 'provider', label: 'Earnings owed to a provider' },
  dispute_hold:               { kind: 'liability', scope: 'booking',  label: 'Frozen while a case is open' },
  tax_payable:                { kind: 'liability', scope: null,       label: 'Output tax owed on platform fees' },
  platform_fee_revenue:       { kind: 'revenue',   scope: null,       label: 'Commission on completed work' },
  platform_fixed_fee_revenue: { kind: 'revenue',   scope: null,       label: 'Booking and processing fees' },
  cancellation_compensation:  { kind: 'expense',   scope: 'provider', label: 'Paid to a provider for a late cancellation' }
};

const LEDGER = [];
let ledgerSeq = 0;

class LedgerImbalance extends Error {
  constructor(eventType, debits, credits) {
    super('ledger event "' + eventType + '" does not balance: debits ' + debits + ' against credits ' + credits);
    this.name = 'LedgerImbalance';
    this.eventType = eventType; this.debits = debits; this.credits = credits;
  }
}

function assertBalanced(lines, eventType) {
  let debits = 0, credits = 0;
  lines.forEach(l => {
    if (!ACCOUNTS[l.account]) throw new Error('unknown ledger account: ' + l.account);
    if (!Number.isInteger(l.amountCentavos) || l.amountCentavos <= 0)
      throw new Error('a ledger line must be a positive whole number of centavos: ' + JSON.stringify(l));
    if (l.direction === 'debit') debits += l.amountCentavos;
    else if (l.direction === 'credit') credits += l.amountCentavos;
    else throw new Error('a ledger line needs direction debit or credit: ' + JSON.stringify(l));
  });
  if (debits !== credits) throw new LedgerImbalance(eventType, debits, credits);
  return debits;
}

/* The only way money enters the books. An event that does not balance throws
   before the caller has moved a status, so a half-posted transaction cannot
   exist: the failure is loud now, not a figure that quietly disagrees later. */
function postEvent(eventType, lines, ctx) {
  const total = assertBalanced(lines, eventType);
  const event = {
    id: 'e' + (++ledgerSeq),
    eventType,
    bookingId: (ctx && ctx.bookingId) || null,
    at: (ctx && ctx.at) || new Date().toISOString(),
    note: (ctx && ctx.note) || '',
    source: (ctx && ctx.source) || 'live',
    totalCentavos: total,
    lines: lines.map(l => ({ account: l.account, scope: l.scope || null,
                             direction: l.direction, amountCentavos: l.amountCentavos }))
  };
  LEDGER.push(event);
  return event;
}

function ledgerFor(bookingId) { return LEDGER.filter(e => e.bookingId === bookingId); }

/* Settled means an earnings entry exists — not merely that the booking appears in
   the books at all, because a held job already appears there. */
function isSettled(booking) {
  return ledgerFor(booking.id).some(e => e.eventType === 'booking.settled' || e.eventType === 'booking.settled_cash');
}

/* What one booking has actually put into an account, net of anything already
   taken back from it. Two rules depend on this rather than on a formula: a case
   may only freeze money the job itself earned, and a refund may only reverse the
   fee the job itself paid. Anything else reaches into another provider's
   earnings, or charges commission on parts that were never commissioned. */
function creditedFor(bookingId, account) {
  let net = 0;
  ledgerFor(bookingId).forEach(e => e.lines.forEach(l => {
    if (l.account !== account) return;
    net += (l.direction === 'credit' ? l.amountCentavos : -l.amountCentavos);
  }));
  return Math.max(0, net);
}

/* Debits raise assets and expenses; credits raise liabilities and revenue. */
function accountBalance(account, scope) {
  const def = ACCOUNTS[account];
  if (!def) throw new Error('unknown ledger account: ' + account);
  let debit = 0, credit = 0;
  LEDGER.forEach(event => event.lines.forEach(l => {
    if (l.account !== account) return;
    if (scope !== undefined && l.scope !== scope) return;
    if (l.direction === 'debit') debit += l.amountCentavos; else credit += l.amountCentavos;
  }));
  return (def.kind === 'asset' || def.kind === 'expense') ? debit - credit : credit - debit;
}

/* ---- pricing -----------------------------------------------------------------
   Two rules decide the shape of this function.
   · Parts and materials are money the provider spent, not service the platform
     matched. Commissioning them would take a cut of hardware twice — once out of
     the provider's margin, once out of the customer's bill.
   · The fee comes out of the provider's share, so the customer's total is the
     price the provider published. Nothing is hidden and nothing appears at the
     till that was not on the card (AGENTS.md 24).
   --------------------------------------------------------------------------- */
function commissionRateFor(categoryId) {
  const override = CONFIG.commissionRateByCategory[categoryId];
  return (typeof override === 'number' && override >= 0 && override < 1)
    ? override : CONFIG.commissionRateDefault;
}

function computeBreakdown(opts) {
  const base = Math.round(opts.baseCentavos);
  const inclusions = opts.inclusions || [];
  const passThrough = inclusions.reduce((sum, i) => sum + Math.round(i.amountCentavos), 0);
  const rate = opts.commissionRate !== undefined ? opts.commissionRate : commissionRateFor(opts.categoryId);
  const commission = Math.round(base * rate);
  const fixedFee = Math.round(opts.fixedFeeCentavos !== undefined ? opts.fixedFeeCentavos : CONFIG.fixedFeeCentavos);
  const tax = Math.round((commission + fixedFee) * CONFIG.taxRate);
  return {
    baseCentavos: base,
    inclusions: inclusions.map(i => ({ label: i.label, amountCentavos: Math.round(i.amountCentavos) })),
    passThroughCentavos: passThrough,
    commissionRate: rate,
    commissionCentavos: commission,
    fixedFeeCentavos: fixedFee,
    taxCentavos: tax,
    providerShareCentavos: base - commission,
    customerTotalCentavos: base + passThrough + fixedFee + tax,
    platformRevenueCentavos: commission + fixedFee
  };
}

/* A booking keeps the terms that were agreed, not a live pointer into a rate
   table. Rates change under the admin console; a completed job's money must never
   be recomputed from today's configuration or its receipt and the ledger part
   ways from each other. */
function freezePricing(booking, breakdown) {
  booking.pricing = Object.assign({ frozenAt: new Date().toISOString() }, breakdown);
  booking.amountCentavos = breakdown.customerTotalCentavos;
  return booking.pricing;
}

/* ---- statements read the ledger, nothing else ─────────────────────────────── */
function platformStatement(range) {
  const from = range && range.from ? Date.parse(range.from) : 0;
  const to = range && range.to ? Date.parse(range.to) : Infinity;
  const events = LEDGER.filter(e => { const t = Date.parse(e.at); return t >= from && t <= to; });
  let commission = 0, reversed = 0, fees = 0, gross = 0, settled = 0, tax = 0;
  events.forEach(e => {
    e.lines.forEach(l => {
      if (l.account === 'platform_fee_revenue') {
        if (l.direction === 'credit') commission += l.amountCentavos; else reversed += l.amountCentavos;
      }
      if (l.account === 'platform_fixed_fee_revenue' && l.direction === 'credit') fees += l.amountCentavos;
      if (l.account === 'tax_payable' && l.direction === 'credit') tax += l.amountCentavos;
    });
    if (e.eventType === 'booking.settled' || e.eventType === 'booking.settled_cash') {
      const b = bookingById(e.bookingId);
      if (b && b.pricing) { gross += b.pricing.baseCentavos; settled += 1; }
    }
  });
  return {
    grossServicesCentavos: gross,
    commissionEarnedCentavos: commission - reversed,
    fixedFeesCentavos: fees,
    refundsReversedCentavos: reversed,
    taxCollectedCentavos: tax,
    netRevenueCentavos: commission - reversed + fees,
    owedByCashProvidersCentavos: accountBalance('commission_receivable'),
    settledBookings: settled,
    from: (range && range.from) || null,
    to: (range && range.to) || null
  };
}

function nextPayoutDate() {
  const d = new Date();
  d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));      /* the next Monday */
  return d.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
}

function providerBalances(providerId) {
  const hold = CONFIG.payoutHoldDays * 86400000;
  const now = Date.now();
  const settled = BOOKINGS.filter(b => b.providerId === providerId && b.status === 'completed' && b.pricing);
  /* Only jobs the platform was paid for can be paid out. On a cash job the
     provider already holds the customer's money and owes us a fee — counting their
     takings as a payable would let a payout write a cheque from money we never
     received, and the payable would go negative doing it. */
  const held = settled.filter(b => !isCashJob(b));
  const onSite = settled.filter(b => isCashJob(b));
  let pending = 0, available = 0, disputed = 0;
  held.forEach(b => {
    const share = settlementToProvider(b.pricing);
    if (b.status === 'disputed') { disputed += share; return; }
    if (Date.parse(b.pricing.frozenAt || b.createdAt) + hold <= now) available += share; else pending += share;
  });
  return {
    pendingCentavos: pending,
    availableCentavos: available,
    disputedCentavos: disputed,
    collectedOnSiteCentavos: onSite.reduce((t, b) => t + settlementToProvider(b.pricing), 0),
    lifetimeEarnedCentavos: settled.reduce((t, b) => t + settlementToProvider(b.pricing), 0),
    commissionOwedCentavos: accountBalance('commission_receivable', providerId),
    payoutMinCentavos: CONFIG.payoutMinCentavos,
    nextPayoutOn: nextPayoutDate()
  };
}

function providerStatement(providerId) {
  const jobs = BOOKINGS.filter(b => b.providerId === providerId && b.status === 'completed' && b.pricing);
  const gross = jobs.reduce((t, b) => t + b.pricing.baseCentavos, 0);
  const commission = jobs.reduce((t, b) => t + b.pricing.commissionCentavos, 0);
  return {
    completedJobs: jobs.length,
    grossServicesCentavos: gross,
    commissionCentavos: commission,
    /* Held on the provider's behalf, never earned by the platform. */
    partsCollectedCentavos: jobs.reduce((t, b) => t + b.pricing.passThroughCentavos, 0),
    netServiceEarnedCentavos: gross - commission,
    balances: providerBalances(providerId)
  };
}

function commissionReceivableAgeing() {
  const byProvider = {};
  BOOKINGS.filter(b => b.status === 'completed' && b.pricing && isCashJob(b))
    .forEach(b => {
      const key = b.providerId;
      byProvider[key] = byProvider[key] || { providerId: key, owedCentavos: 0, jobs: 0, oldest: b.createdAt };
      byProvider[key].owedCentavos += b.pricing.commissionCentavos;
      byProvider[key].jobs += 1;
      if (Date.parse(b.createdAt) < Date.parse(byProvider[key].oldest)) byProvider[key].oldest = b.createdAt;
    });
  return Object.keys(byProvider).map(k => byProvider[k]);
}

/* The demo jobs, priced against the listing that would have sold them. Written
   as a table rather than inferred from the amounts: an inference would invent a
   parts charge that nobody agreed, and the point of this step is that every peso
   on screen has a line behind it. */
const DEMO_PRICING = {
  b1:  { listingId:'l1',  partsCentavos:1500 },   /* faucet repair + a washer set */
  b2:  { listingId:'l4',  partsCentavos:1500 },
  b3:  { listingId:'l6',  partsCentavos:1500 },
  b6:  { listingId:'l5',  partsCentavos:0    },
  b4:  { listingId:'l11', partsCentavos:1500 },
  pb1: { listingId:'l1',  partsCentavos:1500 },
  pb2: { listingId:'l3',  partsCentavos:2000 },
  pb3: { listingId:'l1',  partsCentavos:0    },
  pb4: { listingId:'l2',  partsCentavos:5000 }
};

/* Accepted jobs carry frozen terms; only completed ones move money. A request
   still waiting for an answer has no price agreed at all, which is exactly what
   both screens tell the user. */
function seedHistoricalLedger() {
  BOOKINGS.filter(b => b.source === 'demo' && DEMO_PRICING[b.id] && !b.pricing).forEach(b => {
    const spec = DEMO_PRICING[b.id];
    const listing = listingById(spec.listingId);
    if (!listing) return;
    const provider = providerOf(b);
    b.listingId = listing.id;
    b.pricing = Object.assign({ frozenAt: b.createdAt, commissionRate: commissionRateFor(listing.categoryId) },
      computeBreakdown({
        baseCentavos: listing.basePriceCentavos,
        categoryId: listing.categoryId,
        inclusions: spec.partsCentavos ? [{ label:'Parts and materials', amountCentavos: spec.partsCentavos }] : []
      }));
    b.amountCentavos = b.pricing.customerTotalCentavos;
    /* A job the record says was paid on site never passed through us; everything
       else in the demo roster was booked through the partner. Read from the code,
       never from the words on screen. */
    if (!b.payMethod) b.payMethod = b.payStatus === 'pending_site' ? 'cash' : 'gcash';
    if (!b.payStatus) b.payStatus = 'unpaid';
    b.summary = b.summary || listing.title;
    void provider;
  });
  BOOKINGS.filter(b => b.source === 'demo' && b.pricing &&
                       ['upcoming', 'ongoing', 'completed'].includes(b.status))
    .forEach(b => takeHolding(b));
  BOOKINGS.filter(b => b.source === 'demo' && b.status === 'completed' && b.pricing && !isSettled(b))
    .forEach(b => settleBooking(b));
  BOOKINGS.filter(b => b.source === 'demo' && b.pricing &&
                       ['upcoming', 'ongoing', 'completed'].includes(b.status) &&
                       !isCashJob(b))
    .forEach(b => { if (!paymentsFor(b.id).length)
      recordPayment(b, 'authorization', 'authorized', b.pricing.customerTotalCentavos, 'Held on acceptance'); });
  BOOKINGS.filter(b => b.source === 'demo' && b.status === 'completed' && b.pricing)
    .forEach(b => {
      const cash = isCashJob(b);
      if (!paymentsFor(b.id).some(p => p.type === 'capture' || p.type === 'collection'))
        recordPayment(b, cash ? 'collection' : 'capture', cash ? 'collected' : 'captured',
                      b.pricing.customerTotalCentavos, cash ? 'Collected on site' : 'Released on completion');
    });
  /* A deposit that outlives its job is money still owed to somebody. Anything
     that finished without a settlement and without a return is a hole. */
  BOOKINGS.filter(b => b.source === 'demo' && ['cancelled','expired','no_show'].includes(b.status))
    .forEach(b => { if (accountBalance('customer_deposit', b.id) > 0) returnHolding(b, 'Demo record closed'); });
}

/* What the platform owes the provider out of a settled job: their share of the
   service, plus every peso of parts the customer was charged for. Parts are
   collected on the provider's behalf — keeping them would be taking a second cut
   of hardware, and dropping them is what made the seed fail to balance. */
function settlementToProvider(pricing) {
  return pricing.providerShareCentavos + pricing.passThroughCentavos;
}

/* The credit side of a settlement, built once so the historic seed and a live
   capture cannot drift apart. Zero-value lines are left out rather than written
   as ₱0.00, which assertBalanced rightly refuses. */
function settlementLines(booking) {
  const p = booking.pricing;
  const lines = [
    { account:'provider_payable', scope: booking.providerId, direction:'credit', amountCentavos: settlementToProvider(p) },
    { account:'platform_fee_revenue', direction:'credit', amountCentavos: p.commissionCentavos }
  ];
  if (p.fixedFeeCentavos > 0)
    lines.push({ account:'platform_fixed_fee_revenue', direction:'credit', amountCentavos: p.fixedFeeCentavos });
  if (p.taxCentavos > 0)
    lines.push({ account:'tax_payable', direction:'credit', amountCentavos: p.taxCentavos });
  return lines;
}

/* Funds the platform is holding for a job it has not delivered yet. Accepting
   creates the obligation, completing converts it into provider earnings and
   platform revenue, and cancelling or letting it lapse gives it back. Cash work
   never passes through here, because no money was ever taken for it. */
function takeHolding(booking) {
  if (!booking.pricing) return null;
  if (isCashJob(booking)) return null;
  if (ledgerFor(booking.id).some(e => e.eventType === 'payment.authorized')) return null;
  return postEvent('payment.authorized', [
    { account:'escrow_held', direction:'debit', amountCentavos: booking.pricing.customerTotalCentavos },
    { account:'customer_deposit', scope: booking.id, direction:'credit', amountCentavos: booking.pricing.customerTotalCentavos }
  ], { bookingId: booking.id, note:'Held on acceptance', source: booking.source });
}

function returnHolding(booking, note) {
  const held = accountBalance('customer_deposit', booking.id);
  if (held <= 0) return null;
  return postEvent('payment.voided', [
    { account:'customer_deposit', scope: booking.id, direction:'debit', amountCentavos: held },
    { account:'escrow_held', direction:'credit', amountCentavos: held }
  ], { bookingId: booking.id, note: note || 'Held money returned', source: booking.source });
}

function settleBooking(booking) {
  const p = booking.pricing;
  if (isCashJob(booking)) {
    /* The provider collected the cash on site. The platform never held it, so
       there is no asset to move — only a fee the provider now owes. */
    return postEvent('booking.settled_cash', [
      { account:'commission_receivable', scope: booking.providerId, direction:'debit', amountCentavos: p.commissionCentavos },
      { account:'platform_fee_revenue', direction:'credit', amountCentavos: p.commissionCentavos }
    ], { bookingId: booking.id, at: p.frozenAt, note: 'Cash settled on site', source: 'demo' });
  }
  return postEvent('booking.settled',
    [{ account:'customer_deposit', scope: booking.id, direction:'debit', amountCentavos: p.customerTotalCentavos }]
      .concat(settlementLines(booking)),
    { bookingId: booking.id, at: p.frozenAt, note: 'Released on completion', source: 'demo' });
}

/* ═══════════════════════════════════════════════════════════════════════════
   DOMAIN KERNEL · part 3 — the booking state machine
   ═══════════════════════════════════════════════════════════════════════════
   A booking is the most important object in the product, so the rules about what
   may happen to it belong in one table rather than scattered through nineteen
   `if (status === …)` comparisons in the markup. Every move names who may make
   it, what has to be true first, and what money, notification and record it
   leaves behind.
   ═══════════════════════════════════════════════════════════════════════════ */

const BOOKING_STATES = {
  requested: { label:'Requested',       tone:'quiet',  hint:'Waiting for the provider to answer',
               next:'They accept, the visit is held, or the request lapses on its own' },
  upcoming:  { label:'Accepted',        tone:'held',   hint:'Booked, not started',
               next:'The provider confirms and starts out' },
  en_route:  { label:'On the way',      tone:'active', hint:'The provider has left for you',
               next:'The provider arrives' },
  arrived:   { label:'Arrived',         tone:'active', hint:'The provider is at the door',
               next:'Work begins' },
  ongoing:   { label:'In progress',     tone:'active', hint:'The work is being done now',
               next:'Completion, then your confirmation and the record' },
  completed: { label:'Completed',       tone:'done',   hint:'Done — the record and the payment stand',
               next:'' },
  cancelled: { label:'Cancelled',       tone:'gone',   hint:'Closed before the work was delivered',
               next:'' },
  expired:   { label:'No answer',       tone:'gone',   hint:'The request was never accepted',
               next:'' },
  no_show:   { label:'No one there',    tone:'gone',   hint:'The provider arrived and no one was home',
               next:'' },
  disputed:  { label:'Under review',    tone:'alert',  hint:'Evidence is being read; nothing is decided yet',
               next:'' }
};

/* Terminal states settle. Nothing leaves them except a dispute raised in time. */
const FINISHED_STATES = ['completed', 'cancelled', 'expired', 'no_show'];

/* One timeline, three uses: the customer's tracking view, the dispute evidence
   chain, and the administrator's audit. They were three separate inventions,
   each hand-typed into markup. */
const STATUS_EVENTS = [];
let statusEventSeq = 0;
let statusNoteSeq = 0;

function recordStatusEvent(booking, from, to, actor, note, at) {
  const entry = { id: 'se' + (++statusEventSeq), bookingId: booking.id, from, to,
                  actorRole: (actor && actor.role) || 'system', actorId: (actor && actor.id) || null,
                  note: note || '', at: at || new Date().toISOString() };
  STATUS_EVENTS.push(entry);
  return entry;
}

function bookingTimeline(bookingId) {
  return STATUS_EVENTS.filter(e => e.bookingId === bookingId)
    .sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
}

function label(status) { return (BOOKING_STATES[status] || { label: status }).label; }
function stateHint(status) { return (BOOKING_STATES[status] || { hint: '' }).hint; }
/* What happens after this state — the same table, because a tracking card that
   typed these sentences itself could disagree with the machine that owns them. */
function nextStepFor(status) { return (BOOKING_STATES[status] || { next: '' }).next; }

class IllegalTransition extends Error {
  constructor(from, to) {
    super('a booking cannot go from "' + from + '" to "' + to + '"');
    this.name = 'IllegalTransition'; this.from = from; this.to = to;
  }
}
class GuardRejected extends Error {
  constructor(reason) { super(reason); this.name = 'GuardRejected'; this.reason = reason; }
}

/* ---- guards ---------------------------------------------------------------- */
function actingAs(actor, roles) { return roles.includes((actor && actor.role) || 'system'); }

function providerIsFreeFrom(booking) {
  /* One job in progress per person. A solo plumber who accepts two overlapping
     visits has promised something they cannot deliver, and the marketplace will
     be judged on the one they missed. */
  const clash = bookingsForProvider().some(b => b.id !== booking.id &&
    (b.status === 'ongoing' || b.status === 'en_route' || b.status === 'arrived'));
  return clash
    ? { ok:false, reason:'You already have a job in progress. Close it out before starting this one.' }
    : { ok:true };
}

/* Accepting is where a visit is promised, so an impossible pair has to be
   refused here rather than at the door. The clash is the same slot on the same
   day: a solo provider may hold Tuesday morning and Tuesday evening, but not
   Tuesday at 10:00 twice. */
function providerIsFreeToAccept(booking) {
  const clash = BOOKINGS.find(b => b.id !== booking.id &&
    b.providerId === booking.providerId &&
    ['upcoming', 'en_route', 'arrived', 'ongoing'].includes(b.status) &&
    b.date === booking.date && b.time === booking.time);
  return clash
    ? { ok:false, reason:'You already hold ' + clash.date + ' at ' + clash.time +
        '. Answer that request first — the same hour cannot belong to two jobs.' }
    : { ok:true };
}

function canDispute(booking) {
  const agreedAt = Date.parse(booking.completedAt || (booking.pricing && booking.pricing.frozenAt) || booking.createdAt);
  return Date.now() <= agreedAt + CONFIG.warrantyDays * 86400000
    ? { ok:true }
    : { ok:false, reason:'The warranty window recorded on this job has passed.' };
}

/* ---- effects --------------------------------------------------------------- */
function onAccept(booking, actor) {
  /* Accepting is the moment a request becomes an agreement, so the terms freeze
     here — what the job costs, what the platform takes, what the provider keeps.
     From now on the booking carries its own price rather than pointing at a rate
     table an administrator may change next week. */
  if (!booking.pricing) {
    const listing = booking.listingId ? listingById(booking.listingId) : defaultListingFor(booking.providerId);
    const provider = providerOf(booking);
    freezePricing(booking, computeBreakdown({
      baseCentavos: listing ? listing.basePriceCentavos : provider.rateCentavos,
      categoryId: listing ? listing.categoryId : provider.serviceId,
      inclusions: []
    }));
    booking.listingId = listing ? listing.id : booking.listingId || null;
    booking.listingTitle = listing ? listing.title : provider.service;
  }
  booking.acceptedAt = new Date().toISOString();
  authorizeBooking(booking);            /* held for a partner job, nothing for cash */
  return { notify:{ to:'customer', title:'Booking confirmed',
                    body: actor.name + ' accepted ' + booking.summary + ' for ' + booking.date + ', ' + booking.time + '.' } };
}

function onStart(booking) {
  booking.startedAt = new Date().toISOString();
  return { notify:{ to:'customer', title:'Work started', body: booking.summary + ' is in progress.' } };
}

function onArrive(booking) {
  booking.arrivedAt = new Date().toISOString();
  return { notify:{ to:'customer', title:'Your provider has arrived',
                    body: providerOf(booking).name + ' is at ' + (booking.address || 'the address you gave') + '.' } };
}

function onComplete(booking) {
  booking.completedAt = new Date().toISOString();
  booking.confirmedBy = null;            /* the customer still has to say yes */
  if (isSettled(booking))                /* already converted into earnings */
    return { notify:{ to:'customer', title:'Service completed', body:'Confirm and rate the job when you are satisfied.' } };
  captureBooking(booking);
  return { notify:{ to:'customer', title:'Service completed',
                    body: booking.summary + ' is marked done. Confirm and rate it when you are satisfied.' } };
}

/* A late cancellation costs the customer something and pays it to the provider —
   never to the platform. A marketplace that earns from cancellations has an
   incentive it should not have. */
function cancellationFee() { return CONFIG.cancellationFeeAfterAcceptCentavos; }

function compensateProvider(booking, note) {
  const fee = cancellationFee();
  if (fee <= 0) return null;
  return { type:'booking.cancelled_compensated',
           lines: [{ account:'cancellation_compensation', scope: booking.providerId, direction:'debit', amountCentavos: fee },
                   { account:'provider_payable', scope: booking.providerId, direction:'credit', amountCentavos: fee }],
           note };
}

function onCancel(booking, actor, opts) {
  const previous = (opts && opts.previousStatus) || booking.status;
  const late = ['upcoming', 'en_route', 'arrived', 'ongoing'].includes(previous);
  booking.cancelledBy = (actor && actor.role) || 'system';
  booking.cancelReason = (opts && opts.reason) ||
    (booking.cancelledBy === 'provider' ? 'Declined by the provider' : 'Cancelled by the customer');
  booking.cancellationFeeCentavos = late ? cancellationFee() : 0;
  voidBooking(booking, 'Cancelled before the work was delivered');
  const ledger = late ? compensateProvider(booking, 'Late cancellation by ' + booking.cancelledBy) : null;
  return { ledger,
    notify:{ to: booking.cancelledBy === 'customer' ? 'provider' : 'customer',
             title:'Booking cancelled',
             body: booking.summary + (late && ledger ? ' was cancelled after acceptance; the call-out fee is recorded.' : ' will not go ahead.') } };
}

function onNoShow(booking) {
  booking.cancelReason = 'The provider arrived and no one was there';
  voidBooking(booking, 'The visit was made but the work was not');
  return { ledger: compensateProvider(booking, 'Call-out made, client not present'),
           notify:{ to:'customer', title:'No one was there',
                    body:'The call-out was made and recorded. The visit fee is owed to the provider.' } };
}

function onExpire(booking) {
  voidBooking(booking, 'Never accepted, so nothing was owed');
  booking.cancelReason = 'No provider answered within ' + CONFIG.acceptTtlMinutes + ' minutes';
  return { notify:{ to:'customer', title:'No answer this time',
                    body:'Try another match — you were not charged and nothing was booked.' } };
}

function onDispute(booking, actor, opts) {
  /* Freeze only what this job has actually paid the provider, less anything
     already held for it. A case raised before completion holds nothing, because
     the money is still with the customer or the platform — the old code froze the
     provider's full share anyway and took it out of whatever else they had earned. */
  const held = Math.max(0, creditedFor(booking.id, 'provider_payable')
                             - accountBalance('dispute_hold', booking.id));
  return {
    ledger: held > 0 ? { type:'dispute.held',
      lines: [{ account:'provider_payable', scope: booking.providerId, direction:'debit', amountCentavos: held },
              { account:'dispute_hold', scope: booking.id, direction:'credit', amountCentavos: held }],
      note:(opts && opts.reason) || 'Case opened' } : null,
    frozenCentavos: held,
    notify:{ to:'admin', title:'Dispute opened',
      body: 'Case on ' + booking.summary + ' is waiting for evidence. '
        + (held > 0 ? peso(held) + ' of this job’s payout is frozen while it is read.'
                    : 'Nothing had been paid out on this job yet, so there was nothing to freeze.')
        + ' Nothing here has decided who was at fault.' }
  };
}

function onUphold(booking) {
  /* Release what the freeze held. This is a decision to hand the money back to
     the provider and it is entered as one — the freeze is never deleted. */
  const held = accountBalance('dispute_hold', booking.id);
  if (held > 0)
    postEvent('dispute.released',
      [{ account:'dispute_hold', scope: booking.id, direction:'debit', amountCentavos: held },
       { account:'provider_payable', scope: booking.providerId, direction:'credit', amountCentavos: held }],
      { bookingId: booking.id, note:'Closed in the provider’s favour', source: booking.source });
  /* A case can be raised while the work is still on the go. Closing it for the
     provider then has to make the money that completion would have made, or the
     job reads completed on screen while the books hold nothing for it and the
     customer's hold is never released. */
  if (booking.pricing && !isSettled(booking)) captureBooking(booking);
  return { notify:{ to:'customer', title:'Case closed',
    body: 'The booking stands as completed. ' + (held > 0 ? peso(held) + ' has been released to the provider.' : 'No payout was held.') } };
}

/* disputed -> cancelled is a decision with a number attached to it. */
function onRefundDue(booking, actor, opts) { return onRefund(booking, actor, opts); }

/* ---- the table ------------------------------------------------------------- */
const TRANSITIONS = {
  requested: {
    upcoming:  { actors:['provider'], guard: providerIsFreeToAccept, effects: onAccept },
    cancelled: { actors:['customer', 'provider', 'system'], effects: onCancel },
    expired:   { actors:['system'],                       effects: onExpire }
  },
  upcoming: {
    en_route:  { actors:['provider'],                     effects: null },
    ongoing:   { actors:['provider'], guard: providerIsFreeFrom, effects: onStart },
    cancelled: { actors:['customer', 'provider'],         effects: onCancel },
    disputed:  { actors:['customer', 'admin'], guard: canDispute, effects: onDispute }
  },
  /* On the way, the visit has not been made, so "no one was there" cannot be true
     yet — that outcome belongs to arrived. A provider who cannot get there, or
     finds the door shut on the way, cancels: late, and with the fee attached. */
  en_route: {
    arrived:   { actors:['provider'],                     effects: onArrive },
    cancelled: { actors:['customer', 'provider'],         effects: onCancel }
  },
  arrived: {
    ongoing:   { actors:['provider'], guard: providerIsFreeFrom, effects: onStart },
    no_show:   { actors:['provider'],                     effects: onNoShow },
    /* The customer is not locked at the door: they may still call it off, and the
       machine charges them for it as a late cancellation rather than inventing a
       visit that never started. */
    cancelled: { actors:['customer'],                     effects: onCancel }
  },
  ongoing: {
    completed: { actors:['provider', 'customer'],         effects: onComplete },
    disputed:  { actors:['customer', 'provider', 'admin'], guard: canDispute, effects: onDispute }
  },
  completed: {
    disputed:  { actors:['customer', 'admin'], guard: canDispute, effects: onDispute }
  },
  disputed: {
    /* Resolution is the administrator's, with the money rules beside it; the
       machine only states which outcomes exist from here. */
    completed: { actors:['admin'],                        effects: onUphold },
    cancelled: { actors:['admin'],                        effects: onRefundDue }
  },
  cancelled: {}, expired: {}, no_show: {}
};

/* ---- the only door through -------------------------------------------------- */
function transitionAllowed(booking, to, actor) {
  const rules = TRANSITIONS[booking.status];
  if (!rules || !rules[to])
    return { ok:false, reason:'A booking that is ' + label(booking.status).toLowerCase() + ' cannot become ' + label(to).toLowerCase() + '.' };
  if (!actingAs(actor, rules[to].actors))
    return { ok:false, reason:'Only ' + rules[to].actors.join(' or ') + ' can do that.' };
  return rules[to].guard ? rules[to].guard(booking, actor) : { ok:true, actors: rules[to].actors };
}

function nextActionFor(booking, role) {
  const rules = TRANSITIONS[booking.status] || {};
  const options = Object.keys(rules).filter(to => actingAs({ role }, rules[to].actors));
  return options;
}

function attemptTransition(bookingId, to, actor, opts) {
  const booking = bookingById(bookingId);
  if (!booking) throw new Error('no booking ' + bookingId);
  const from = booking.status;
  const permission = transitionAllowed(booking, to, actor);
  if (!permission.ok) throw new GuardRejected(permission.reason);

  /* Effects run before the status moves. If a ledger entry refuses to balance,
     the status never changes and the two cannot disagree about this job. */
  const outcome = TRANSITIONS[from][to].effects
    ? TRANSITIONS[from][to].effects(booking, actor, Object.assign({ previousStatus: from }, opts || {}))
    : {};

  booking.status = to;
  booking.statusChangedAt = new Date().toISOString();
  if (outcome.refundDue) booking.refundDue = true;
  recordStatusEvent(booking, from, to, actor, (opts && opts.note) || '');

  if (outcome.ledger)
    postEvent(outcome.ledger.type, outcome.ledger.lines,
      { bookingId: booking.id, note: outcome.ledger.note, source: booking.source });

  if (outcome.notify) {
    pushStatusNotification(booking, outcome.notify);
    /* The thread tells the same story the notification does, from the side that
       acted. Two accounts of one move is how a chat and a tracking view come to
       disagree about what happened. */
    pushThreadMessage(booking, outcome.notify.to, actor, outcome.notify.body);
  }
  persist();
  return booking;
}

const STATUS_NOTIFY_ICON = {
  completed:'check-circle', cancelled:'alert-triangle', expired:'clock', no_show:'alert-triangle',
  arrived:'map-pin', en_route:'map-pin', ongoing:'check', upcoming:'calendar', disputed:'scale'
};

function pushStatusNotification(booking, note) {
  if (!note) return;
  NOTIFICATIONS.unshift({ id:'n-' + booking.id + '-' + (++statusNoteSeq),
    title: note.title, body: note.body, time:'Just now', unread:true,
    icon: STATUS_NOTIFY_ICON[booking.status] || 'calendar', bg:'var(--deep-100)', bookingId: booking.id });
}

/* ---- scheduled moves the clock owes us -------------------------------------- */
/* There is no server and no cron: a closed tab runs nothing. Due transitions are
   therefore evaluated whenever the app is opened, and a job that expired an hour
   ago is expired honestly, with its real timestamp, instead of made to look as
   though it only just happened. */
function applyDueTransitions() {
  const applied = [];
  const ttl = CONFIG.acceptTtlMinutes * 60000;
  BOOKINGS.filter(b => b.status === 'requested' && Date.now() - Date.parse(b.createdAt) > ttl)
    .forEach(b => { attemptTransition(b.id, 'expired', { role:'system' }); applied.push({ id:b.id, moved:'expired' }); });

  const grace = CONFIG.autoCompleteHours * 3600000;
  BOOKINGS.filter(b => b.status === 'completed' && !b.confirmedBy && b.completedAt &&
                       Date.now() - Date.parse(b.completedAt) > grace)
    .forEach(b => { b.confirmedBy = 'auto'; applied.push({ id:b.id, moved:'auto-confirmed' }); });
  return applied;
}

/* ---- what the seed owes the machine ---------------------------------------- */
/* The demo jobs get the timeline they claim on screen. A tracking view that shows
   "Provider reviewing" as checked must be able to point at the entry that made it
   checked. */
function seedStatusHistory() {
  if (STATUS_EVENTS.length) return false;
  BOOKINGS.filter(b => b.source === 'demo').forEach(b => {
    const provider = providerOf(b);
    const as = { role:'provider', id: provider.id };
    recordStatusEvent(b, null, 'requested', { role:'customer', id: b.customerId }, 'Request raised', b.createdAt);
    if (b.status === 'requested') return;
    const acceptedAt = new Date(Date.parse(b.createdAt) + 9 * 60000).toISOString();
    if (b.status === 'cancelled' || b.status === 'expired') {
      recordStatusEvent(b, 'requested', b.status,
        { role: /declined/i.test(b.cancelReason || '') ? 'provider' : 'customer', id: b.customerId },
        b.cancelReason || 'Closed', acceptedAt);
      return;
    }
    recordStatusEvent(b, 'requested', 'upcoming', as, 'Accepted', acceptedAt);
    b.acceptedAt = acceptedAt;
    if (b.status === 'upcoming') return;
    b.arrivedAt = new Date(Date.parse(acceptedAt) + 30 * 60000).toISOString();
    if (b.status === 'en_route') { recordStatusEvent(b, 'upcoming', 'en_route', as, 'On the way', b.arrivedAt); return; }
    if (b.status === 'ongoing') {
      recordStatusEvent(b, 'upcoming', 'arrived', as, 'Arrived on site', b.arrivedAt);
      b.startedAt = new Date(Date.parse(b.arrivedAt) + 5 * 60000).toISOString();
      recordStatusEvent(b, 'arrived', 'ongoing', as, 'Work started', b.startedAt);
      return;
    }
    recordStatusEvent(b, 'upcoming', 'arrived', as, 'Arrived on site', b.arrivedAt);
    const startedAt = new Date(Date.parse(b.arrivedAt) + 5 * 60000).toISOString();
    recordStatusEvent(b, 'arrived', 'ongoing', as, 'Work started', startedAt);
    b.startedAt = startedAt;
    b.completedAt = new Date(Date.parse(startedAt) + 40 * 60000).toISOString();
    recordStatusEvent(b, 'ongoing', 'completed', as, 'Marked complete', b.completedAt);
    /* A job the demo says was paid for is one the customer confirmed. */
    b.confirmedBy = ['captured', 'collected'].includes(b.payStatus) ? 'customer' : null;
  });
  return true;
}

/* ═══════════════════════════════════════════════════════════════════════════
   DOMAIN KERNEL · part 4 — payments, the gateway seam, and payouts
   ═══════════════════════════════════════════════════════════════════════════
   The ledger says what money means; a payment record says what was actually done
   to it. Both are needed: a booking can be authorised, then partly refunded, then
   voided, and each of those is a row with a reference a partner could be shown.
   Nothing here talks to a network. The interface is the shape a real gateway
   would implement, so PayMongo or Xendit slots in without touching a screen.
   ═══════════════════════════════════════════════════════════════════════════ */

const PAYMENTS = [];
let paymentSeq = 0;

/* Payment status is the money axis. It is kept apart from the booking axis on
   purpose: a job can be completed and still unpaid, or cancelled and refunded. */
const PAYMENT_LABELS = {
  unpaid:        'Unpaid',
  pending_site:  'Pending (Cash on Arrival)',
  authorized:    'Held, not yet paid',
  captured:      'Paid Online',
  collected:     'Paid on Site',
  refunded:      'Refunded',
  partially_refunded: 'Partly refunded',
  voided:        'Never charged'
};

/* A booking stores codes. The words are produced on the way to a screen, because
   the money rules used to read the words: renaming "Cash on Arrival" anywhere in
   the copy would silently change how a job is held, settled, frozen or refunded,
   and a booking-axis word like "Cancelled" could and did land on the money axis
   (AGENTS.md 22). */
const PAY_METHODS = {
  gcash: 'GCash (0912***6789)',
  cash:  'Cash on Arrival'
};

function payMethodLabel(booking){ return PAY_METHODS[booking.payMethod] || PAY_METHODS.gcash; }
function payStatusLabel(booking){ return PAYMENT_LABELS[booking.payStatus] || PAYMENT_LABELS.unpaid; }
/* Cash is a settlement route, not a phrase: it is the one method where the
   platform never holds the money, and every rule that branches on it reads this. */
function isCashJob(booking){ return booking.payMethod === 'cash'; }

function recordPayment(booking, type, status, amountCentavos, note) {
  const row = {
    id: 'pay' + (++paymentSeq),
    bookingId: booking.id,
    type,                                  /* authorization | capture | refund | void | collection */
    status,                                /* the values in PAYMENT_LABELS */
    method: booking.payMethod || 'cash',
    amountCentavos,
    gatewayRef: MockGateway.ref(type),     /* a real gateway returns its own id here */
    at: new Date().toISOString(),
    note: note || ''
  };
  PAYMENTS.push(row);
  booking.payStatus = status;                        /* the code; screens map it to words */
  return row;
}

function paymentsFor(bookingId) { return PAYMENTS.filter(p => p.bookingId === bookingId); }

/* ---- the seam --------------------------------------------------------------
   Four verbs, no business rules: a gateway moves money, this kernel decides what
   that means. A replacement implements the same four and returns the same shape. */
const MockGateway = {
  name: 'mock',
  ref(kind) { return 'MOCK-' + String(kind).slice(0, 4).toUpperCase() + '-' + Date.now().toString(36) + '-' + (++paymentSeq); },
  authorize(amountCentavos) { return { ok: true, heldCentavos: amountCentavos, ref: this.ref('auth') }; },
  capture(amountCentavos)   { return { ok: true, capturedCentavos: amountCentavos, ref: this.ref('cap') }; },
  refund(amountCentavos)    { return { ok: true, refundedCentavos: amountCentavos, ref: this.ref('ref') }; },
  void_()                   { return { ok: true, ref: this.ref('void') }; }
};
const Gateway = MockGateway;   /* swap this line, nothing else, to go live */

/* ---- the money half of each transition ------------------------------------- */
function authorizeBooking(booking) {
  if (isCashJob(booking)) {
    booking.payStatus = 'pending_site';
    return null;                       /* nothing is taken until the work is done */
  }
  if (!booking.pricing) return null;
  if (paymentsFor(booking.id).some(p => p.type === 'authorization')) return null;
  const held = Gateway.authorize(booking.pricing.customerTotalCentavos);
  if (!held.ok) throw new Error('the payment partner refused to hold this amount');
  takeHolding(booking);
  return recordPayment(booking, 'authorization', 'authorized', held.heldCentavos, 'Held on acceptance');
}

function captureBooking(booking) {
  const p = booking.pricing;
  if (!p) return null;
  if (isSettled(booking)) return null;
  if (isCashJob(booking)) {
    /* The customer paid the provider on site. The platform never held a peso, so
       there is nothing to capture — only the fee it is now owed. */
    settleBooking(booking);
    return recordPayment(booking, 'collection', 'collected', p.customerTotalCentavos, 'Collected on site by the provider');
  }
  const taken = Gateway.capture(p.customerTotalCentavos);
  if (!taken.ok) throw new Error('the payment partner refused to release this amount');
  settleBooking(booking);
  const rows = [recordPayment(booking, 'capture', 'captured', taken.capturedCentavos, 'Released on completion')];
  const auth = paymentsFor(booking.id).find(x => x.type === 'authorization');
  if (auth) auth.status = 'captured';
  return rows;
}

function voidBooking(booking, note) {
  const held = accountBalance('customer_deposit', booking.id);
  if (held <= 0) return null;
  Gateway.void_();
  returnHolding(booking, note);
  const voided = paymentsFor(booking.id).find(x => x.type === 'authorization' && x.status === 'authorized');
  if (voided) voided.status = 'voided';
  return recordPayment(booking, 'void', 'voided', held, note || 'Held money returned, nothing charged');
}

/* The credit lines this booking actually put on the books, read back from the
   ledger rather than derived from a rate. A refund takes these back. */
function postedCredits(booking) {
  const out = [];
  ledgerFor(booking.id).forEach(e => {
    if (e.eventType !== 'booking.settled' && e.eventType !== 'booking.settled_cash') return;
    e.lines.forEach(l => { if (l.direction === 'credit') out.push({ account: l.account, scope: l.scope, amountCentavos: l.amountCentavos }); });
  });
  return out;
}

/* What the platform can actually hand back. A partner job the customer has paid
   for is refundable up to the agreed total; a job still on hold is refundable up
   to the hold; and on a cash job the visit money never passed through us, so only
   our own fee is ours to forgive. */
function refundableCentavos(booking) {
  const p = booking.pricing;
  if (!p) return 0;
  if (isCashJob(booking)) return creditedFor(booking.id, 'platform_fee_revenue');
  if (!isSettled(booking)) return Math.max(0, accountBalance('customer_deposit', booking.id));
  const already = paymentsFor(booking.id).filter(x => x.type === 'refund').reduce((t, x) => t + x.amountCentavos, 0);
  return Math.max(0, p.customerTotalCentavos - already);
}

/* A refund takes money out of every place the settlement put it in, in the same
   proportions it went in — the provider's share, our fee, the fixed fee and any
   tax, line for line from the booking's own entries. Re-deriving the split from
   today's rate would put commission on parts the platform never commissioned, and
   capping our fee by the platform's whole revenue lets one provider's refund be
   funded from another's earnings. */
function refundLines(booking, amountCentavos) {
  const p = booking.pricing;
  if (isCashJob(booking))
    return [{ account:'platform_fee_revenue', direction:'debit', amountCentavos: amountCentavos },
            { account:'commission_receivable', scope: booking.providerId, direction:'credit', amountCentavos: amountCentavos }];

  /* Still on hold: nothing was ever earned, so the hold simply goes back. */
  if (!isSettled(booking))
    return [{ account:'customer_deposit', scope: booking.id, direction:'debit', amountCentavos: amountCentavos },
            { account:'escrow_held', direction:'credit', amountCentavos: amountCentavos }];

  const total = p.customerTotalCentavos;
  const debits = postedCredits(booking).map(c => ({
    account: c.account, scope: c.scope, direction: 'debit',
    amountCentavos: Math.min(c.amountCentavos, Math.round(c.amountCentavos * amountCentavos / total))
  })).filter(l => l.amountCentavos > 0);
  /* Rounding has to land somewhere: the largest line absorbs the remainder so the
     reversal adds up to exactly the money leaving the platform. */
  const sum = debits.reduce((t, l) => t + l.amountCentavos, 0);
  const gap = amountCentavos - sum;
  if (gap !== 0 && debits.length) {
    const biggest = debits.reduce((a, b) => (b.amountCentavos > a.amountCentavos ? b : a));
    if (biggest.amountCentavos + gap > 0) biggest.amountCentavos += gap;
  }
  return debits.concat([{ account:'escrow_held', direction:'credit', amountCentavos: amountCentavos }]);
}

/* A refund takes money out of three places at once: back to the customer, out of
   what we owe the provider, and off our own earned fee. Pro rata against the
   settlement this job actually made, because taking a full commission on work we
   agreed to refund would be taking a cut of nothing. */
function refundBooking(booking, amountCentavos, actor, note) {
  const p = booking.pricing;
  if (!p) throw new GuardRejected('this job never had terms agreed, so there is nothing to refund');
  const cap = refundableCentavos(booking);
  if (cap <= 0)
    throw new GuardRejected(isCashJob(booking)
      ? 'The customer paid on site and no fee was booked on this job, so there is nothing the platform can return.'
      : 'This job has already been refunded in full, or nothing is being held for it.');
  const amount = Math.min(Math.round(amountCentavos), cap);
  if (amount <= 0) throw new GuardRejected('a refund has to be at least one centavo');

  /* Any freeze must be released into the payable before it can be paid out of. */
  const held = accountBalance('dispute_hold', booking.id);
  if (held > 0) postEvent('dispute.released',
    [{ account:'dispute_hold', scope: booking.id, direction:'debit', amountCentavos: held },
     { account:'provider_payable', scope: booking.providerId, direction:'credit', amountCentavos: held }],
    { bookingId: booking.id, note:'Released to fund a refund', source: booking.source });

  const lines = refundLines(booking, amount);
  const providerLine = lines.find(l => l.account === 'provider_payable');
  if (providerLine && providerLine.amountCentavos > accountBalance('provider_payable', booking.providerId))
    throw new GuardRejected('the provider has already been paid out; this refund needs a claw-back, which the pilot does not do');

  Gateway.refund(amount);
  postEvent('payment.refunded', lines,
    { bookingId: booking.id, note: note || 'Refunded after review', source: booking.source });

  const row = recordPayment(booking, 'refund', amount === cap ? 'refunded' : 'partially_refunded',
    amount, note || 'Refunded after review');
  row.byActor = (actor && actor.role) || 'admin';
  return row;
}

/* ---- payouts ---------------------------------------------------------------
   Not a wallet: the provider never has a balance they can spend. They have an
   accounting position the platform owes to their bank or e-wallet on schedule. */
const PAYOUTS = [];
let payoutSeq = 0;

function runPayoutCycle(providerId) {
  const b = providerBalances(providerId);
  /* The payable is the truth of what we owe; the schedule is the truth of what is
     due yet. A payout can never exceed either, or we would sign out money the
     books do not have. */
  const payable = accountBalance('provider_payable', providerId);
  const amount = Math.min(b.availableCentavos, payable);
  if (amount < b.payoutMinCentavos)
    return { paid:false, reason:peso(b.payoutMinCentavos - amount) + ' short of the ' + peso(b.payoutMinCentavos) + ' minimum', payout:null };
  const account = (state.providerProfileData && state.providerProfileData.bankAccount) || 'GCash (masked)';
  const payout = {
    id: 'po' + (++payoutSeq), providerId,
    amountCentavos: amount,
    method: /gcash/i.test(account) ? 'GCash' : 'Bank transfer',
    destination: String(account).replace(/\d{4}(?=.*\d)/g, '****'),
    status: 'paid',
    createdAt: new Date().toISOString()
  };
  postEvent('payout.executed', [
    { account:'provider_payable', scope: providerId, direction:'debit', amountCentavos: payout.amountCentavos },
    { account:'escrow_held', direction:'credit', amountCentavos: payout.amountCentavos }
  ], { bookingId: null, note:'Payout ' + payout.id, source: 'live' });
  PAYOUTS.push(payout);
  persist();
  return { paid:true, reason:'', payout };
}

/* ---- the machine's refund move, replacing the placeholder ------------------ */
function onRefund(booking, actor, opts) {
  const amount = opts && opts.refundCentavos ? opts.refundCentavos : refundableCentavos(booking);
  const cash = isCashJob(booking);
  refundBooking(booking, amount, actor, (opts && opts.reason) || 'Case closed in the customer’s favour');
  booking.resolvedBy = (actor && actor.role) || 'admin';
  return { notify:{ to:'customer', title: cash ? 'Fee reversed' : 'Refund issued',
    body: cash
      ? peso(amount) + ' of platform fee was taken off this job. The visit money was paid straight to the provider, so returning that part is between you and them.'
      : peso(amount) + ' is on its way back to you.' } };
}

/* ═══════════════════════════════════════════════════════════════════════════
   DOMAIN KERNEL · part 5 — disputes, the money console, and configuration
   ═══════════════════════════════════════════════════════════════════════════
   A dispute exists to hold money and gather evidence while a person reads both.
   It is not a verdict, and the screen says so.
   ═══════════════════════════════════════════════════════════════════════════ */

const DISPUTES = [];
let disputeSeq = 0;
/* ── messages are records, not painted bubbles ────────────────────────────────
   A thread belongs to the two people and the job behind it, so both sides read
   the same rows and what you type is stored rather than appended to the screen
   and lost on the next render. The demo threads are the status timeline told in
   the first person — nothing is invented that the record does not say. (26, 77) */
const MESSAGES = [];
let messageSeq = 0;

function threadKeyOf(customerId, providerId){ return 't-' + customerId + '-' + providerId; }
function threadKeyFor(booking){ return threadKeyOf(booking.customerId, booking.providerId); }
function threadMessages(key){
  return MESSAGES.filter(m => m.thread === key)
    .sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
}

function appendMessage(thread, bookingId, from, text, at){
  const m = { id:'m' + (++messageSeq), thread, bookingId: bookingId || null,
              from, text, at: at || new Date().toISOString() };
  MESSAGES.push(m);
  return m;
}

function postMessage(booking, from, text, at){
  return appendMessage(threadKeyFor(booking), booking.id, from, text, at);
}

/* Each move says what it is, to the person who did not make it. The same sentence
   the notification carries, so a thread and a notification cannot disagree. */
function pushThreadMessage(booking, to, actor, note){
  const other = to === 'customer' ? 'provider' : 'customer';
  if (actor && actor.role === other) postMessage(booking, other, note);
}

/* Each move said the way the person who made it would say it. The status label
   alone ("Arrived — Arrived on site") reads like a log pasted into a chat
   window; the event still owns the fact, this only phrases it. */
const THREAD_LINES = {
  upcoming:  'Accepted — I will be there as arranged.',
  en_route:  'On the way now.',
  arrived:   'I have arrived at the address.',
  ongoing:   'Starting the work now.',
  completed: 'Work is done. Confirm and rate it when you are satisfied.',
  cancelled: 'This one will not go ahead.',
  expired:   'No answer came in time, so nothing was booked.',
  no_show:   'I made the call-out but no one was there.',
  disputed:  'I have raised this with the help desk.'
};

function seedMessages() {
  if (MESSAGES.length) return false;
  BOOKINGS.filter(b => b.source === 'demo').forEach(b => {
    postMessage(b, 'customer', b.request || b.summary, b.createdAt);
    bookingTimeline(b.id).forEach(e => {
      if (e.to === 'requested' || e.from === e.to) return;
      const who = e.actorRole === 'provider' ? 'provider' : (e.actorRole === 'customer' ? 'customer' : null);
      if (!who) return;
      postMessage(b, who, THREAD_LINES[e.to] || label(e.to), e.at);
    });
  });
  return true;
}

function openDispute(bookingId, actor, reason) {
  const b = bookingById(bookingId);
  if (!b) throw new Error('no booking ' + bookingId);
  if (DISPUTES.some(d => d.bookingId === bookingId && d.status === 'under review'))
    throw new GuardRejected('this job already has a case open.');
  const text = (reason || '').trim();
  if (text.length < 10)
    throw new GuardRejected('Say what went wrong in a few words — a person has to read it.');
  /* The move happens first. If the machine refuses it, or the freeze will not
     balance, no case is left pointing at a booking that never opened. */
  attemptTransition(bookingId, 'disputed', actor, { reason: text });
  const d = {
    id: 'DS-' + new Date().getFullYear() + '-' + String(++disputeSeq).padStart(4, '0'),
    bookingId, openedBy: (actor && actor.role) || 'customer', reason: text,
    amountInClaimCentavos: b.pricing ? b.pricing.customerTotalCentavos : b.amountCentavos,
    /* What the books actually froze, not what the claim asks for — the card can
       then say honestly when a case has no money behind it. */
    frozenCentavos: accountBalance('dispute_hold', bookingId),
    status: 'under review',
    openedAt: new Date().toISOString(),
    evidence: bookingTimeline(bookingId).map(e => ({ at: e.at, text: label(e.to) + (e.note ? ' — ' + e.note : '') })),
    resolution: null, resolvedAt: null
  };
  DISPUTES.push(d);
  b.disputeId = d.id;
  persist();
  return d;
}

/* Three outcomes, each with its own money movement. "Upheld" here means the
   provider keeps what is theirs; "refunded" moves money back out of the holding
   and off our own earned fee. */
function resolveDispute(disputeId, outcome, actor, note) {
  const d = DISPUTES.find(x => x.id === disputeId);
  if (!d) throw new Error('no dispute ' + disputeId);
  if (d.status !== 'under review') throw new GuardRejected('this case was already closed as ' + d.status.toLowerCase() + '.');
  const b = bookingById(d.bookingId);
  if (outcome === 'upheld') {
    attemptTransition(b.id, 'completed', { role: 'admin', id: actor && actor.id });
    d.status = 'closed — the booking stands';
  } else if (outcome === 'partial') {
    const half = Math.round((note && note.amountCentavos) || d.amountInClaimCentavos / 2);
    attemptTransition(b.id, 'cancelled', { role: 'admin', id: actor && actor.id }, { refundCentavos: half, reason: note && note.reason });
    d.status = 'closed — partly refunded';
  } else if (outcome === 'refunded') {
    attemptTransition(b.id, 'cancelled', { role: 'admin', id: actor && actor.id },
                      { refundCentavos: d.amountInClaimCentavos, reason: note && note.reason });
    d.status = 'closed — refunded';
  } else throw new Error('unknown dispute outcome: ' + outcome);
  d.resolution = (note && note.reason) || '';
  d.resolvedAt = new Date().toISOString();
  adminLog('Dispute ' + d.status.split('—')[1].trim(), 'Case ' + d.id, 'Both parties notified');
  persist();
  return d;
}

function seedDemoDispute() {
  if (DISPUTES.length) return false;
  /* Tied to a real record so the numbers on this screen are the numbers in the
     books: the job exists, was completed, and is inside the warranty window. */
  const b = BOOKINGS.find(x => x.source === 'demo' && x.status === 'completed' && x.pricing && x.providerId === 'p2');
  if (!b) return false;
  b.confirmedBy = 'customer';
  /* The freeze is a real entry, not a caption on the screen. */
  const held = settlementToProvider(b.pricing);
  const d = {
    id: 'DS-2026-0001', bookingId: b.id, openedBy: 'customer',
    reason: 'The same fault came back three days after the repair.',
    amountInClaimCentavos: b.pricing.customerTotalCentavos,
    frozenCentavos: held,
    status: 'under review', openedAt: new Date(Date.now() - 2 * 86400000).toISOString(),
    evidence: bookingTimeline(b.id).map(e => ({ at: e.at, text: label(e.to) + (e.note ? ' — ' + e.note : '') })),
    resolution: null, resolvedAt: null
  };
  DISPUTES.push(d);
  b.disputeId = d.id;
  disputeSeq = 1;
  postEvent('dispute.held', [
    { account: 'provider_payable', scope: b.providerId, direction: 'debit', amountCentavos: held },
    { account: 'dispute_hold', scope: b.id, direction: 'credit', amountCentavos: held }
  ], { bookingId: b.id, note: d.reason, source: 'demo' });
  b.status = 'disputed';
  recordStatusEvent(b, 'completed', 'disputed', { role: 'customer', id: b.customerId }, d.reason, d.openedAt);
  return true;
}

/* ---- figures the console derives instead of typing ──────────────────────── */
function adminCounts() {
  const verified = PROVIDERS.length;                       /* the demo roster is verified */
  const open = BOOKINGS.filter(b => !FINISHED_STATES.includes(b.status) && b.status !== 'disputed').length;
  const pendingVerification = 3;                            /* applicants in the queue */
  const liveCases = DISPUTES.filter(d => d.status === 'under review').length;
  const expiringSoon = 5;
  return { verified, open, pendingVerification, liveCases, expiringSoon };
}
function weeklyBookings() {
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const now = new Date();
  return days.map((name, i) => {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (6 - i));
    const same = b => new Date(b.createdAt).toDateString() === day.toDateString();
    return {
      name,
      completed: BOOKINGS.filter(b => b.status === 'completed' && same(b)).length,
      open: BOOKINGS.filter(b => !FINISHED_STATES.includes(b.status) && same(b)).length
    };
  });
}
function categorySupply() {
  return SERVICES.map(cat => {
    const supply = PROVIDERS.filter(p => p.serviceId === cat.id).length;
    const demand = BOOKINGS.filter(b => providerOf(b).serviceId === cat.id).length;
    return { id: cat.id, label: cat.label, supply, demand };
  });
}

function fmtCfg(v) {
  if (typeof v !== 'number') return String(v);
  if (v < 1 && v > 0) return Math.round(v * 100) + '%';
  if (Number.isInteger(v) && v >= 1000) return pesoShort(v);
  return String(v);
}
function commitConfig() {
  const patch = {};
  const read = (id, fn) => { const el = document.getElementById(id); if (el && el.value !== '' && el.value != null) patch[id] = fn(Number(el.value)); };
  const KEYS = {
    'cfg-commissionRateDefault': v => v / 100,
    'cfg-fixedFeeCentavos': v => Math.round(v * 100),
    'cfg-taxRate': v => v / 100,
    'cfg-cancellationFeeAfterAcceptCentavos': v => Math.round(v * 100),
    'cfg-payoutMinCentavos': v => Math.round(v * 100),
    'cfg-payoutHoldDays': v => Math.round(v),
    'cfg-acceptTtlMinutes': v => Math.round(v),
    'cfg-autoCompleteHours': v => Math.round(v),
    'cfg-warrantyDays': v => Math.round(v)
  };
  const bad = [];
  Object.keys(KEYS).forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.value === '') return;
    const n = Number(el.value);
    if (!Number.isFinite(n) || n < 0) { bad.push(id.replace('cfg-', '')); return; }
    if (id.endsWith('commissionRateDefault') && n > 40) { bad.push('commission cannot exceed 40% here'); return; }
    patch[id] = KEYS[id](n);
  });
  const catPatch = {};
  SERVICES.forEach(cat => {
    const el = document.getElementById('cfgcat-' + cat.id);
    if (el && el.value !== '') {
      const n = Number(el.value);
      if (Number.isFinite(n) && n >= 0 && n <= 40) catPatch[cat.id] = n / 100;
    }
  });
  if (bad.length) { showToast('Check ' + bad.join(', ') + ' — a rate cannot be negative.', 'error'); return; }
  const clean = {};
  Object.keys(KEYS).forEach(id => { if (patch[id] !== undefined) clean[id.replace('cfg-', '')] = patch[id]; });
  if (Object.keys(catPatch).length) clean.commissionRateByCategory = Object.assign({}, CONFIG.commissionRateByCategory, catPatch);
  const changed = setConfig(clean, { role: 'admin' });
  render();
  showToast(changed.length ? changed.length + ' setting' + (changed.length === 1 ? '' : 's') + ' changed, and recorded' : 'Nothing changed');
}

          ${d.evidence.map(e => `<div>${esc(String(e.at).slice(5, 16).replace('T', ' '))} · ${esc(e.text)}</div>`).join('')}
          <div>${esc(String(d.openedAt).slice(5, 16).replace('T', ' '))} · Case opened</div>
        </div>
      </details>
      ${open && held > 0 ? `<div style="margin-top:10px; font-size:var(--t-caption); color:var(--warning-ink); line-height:1.5;">
        ${ic('lock', 12)} ${peso(held)} owed to ${esc(p.name.split(' ')[0])} is held while this is read. Holding it is not a finding against them.</div>` : ''}
      ${open ? `
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
          <button type="button" class="btn sm secondary" style="border-radius:10px;" onclick="resolveCase('${d.id}','upheld')">Close — the booking stands</button>
          <button type="button" class="btn sm secondary" style="border-radius:10px;" onclick="resolveCase('${d.id}','partial')">Close — refund part of it</button>
          <button type="button" class="btn sm danger" style="border-radius:10px;" onclick="resolveCase('${d.id}','refunded')">Close — refund the customer</button>
        </div>
        <div style="font-size:var(--t-caption); color:var(--mist); margin-top:10px; line-height:1.5;">
          A refund takes money back out of the holding, the provider's share and our own fee, pro rata to
          what was refunded. Nothing here decides fault by wording alone — read the evidence first.
        </div>` : `
        <div style="font-size:var(--t-caption); color:var(--success-ink); margin-top:10px;">${esc(d.status)} · ${esc(agoText(d.resolvedAt))}</div>`}
    </div>`;
}
function resolveCase(disputeId, outcome) {
  try {
    const d = resolveDispute(disputeId, outcome, { role: 'admin' },
      outcome === 'refunded' ? { reason: 'The fault was not resolved' } :
      outcome === 'partial' ? { reason: 'Part of the work was not delivered' } : { reason: 'Evidence supports the completed work' });
    showToast('Case ' + d.id + ' ' + d.status.toLowerCase());
  } catch (err) {
    showToast(err.message, 'error');
  }
  render();
}
function resetDemoData() {
  restoreSeed();
  render();
  showToast('Demo data restored — this device’s records are back to the sample set');
}

/* ═══════════════════════════════════════════════════════════════════════════
   DOMAIN KERNEL · part 1 — persistence
   ═══════════════════════════════════════════════════════════════════════════
   Nothing between these banners touches the DOM, and nothing here reaches a
   screen. Records already live in the collections the app mutates; this layer
   decides only whether they survive a reload, and what happens when storage is
   not available at all. Screens call down into the kernel; the kernel never
   calls up into a screen.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Raising this makes an old dump get dropped rather than trusted: a snapshot
   written by a previous shape of these records is discarded and the seed is used
   fresh, so a rebuild can never half-load someone's earlier session. */
/* Raised to 2 by step 3: the dump used to carry two parallel booking arrays. A
   snapshot of that shape cannot be reconciled with one shared table, so it is
   dropped and the seed is used fresh rather than half-read. */
/* 3 adds the ledger, the price list and the configuration to the dump: a session
   that booked a job must reload with the money entries that job created. */
/* 4 adds the status timeline: a tracking view that shows a step as done has to be
   able to point at the entry that made it done. */
/* 5 adds payment records and payouts: the money axis of a job has to survive a
   reload exactly like the service axis does. */
/* 6 adds dispute cases, which carry their own claim amount and outcome. */
const SCHEMA_VERSION = 8;
const STORE_KEY = 'sukinnect.snapshot.v1';

const Store = (function () {
  /* A file:// page has an opaque origin, private windows and hardened Safari
     throw on access, and the WebView can be configured either way. Probe once.
     Storage is a convenience here, never a requirement for the app to run. */
  let usable = false;
  try {
    localStorage.setItem('__sukinnect_probe__', '1');
    localStorage.removeItem('__sukinnect_probe__');
    usable = true;
  } catch (err) { usable = false; }

  let memory = null;

  return {
    kind: usable ? 'local-storage' : 'memory',
    isPersistent: () => usable,
    read() {
      try {
        const raw = usable ? localStorage.getItem(STORE_KEY) : memory;
        if (!raw) return null;
        const snap = JSON.parse(raw);
        return snap && snap.schemaVersion === SCHEMA_VERSION ? snap : null;
      } catch (err) { return null; }        /* an unreadable dump is no dump */
    },
    write(snap) {
      try {
        if (usable) localStorage.setItem(STORE_KEY, JSON.stringify(snap));
        else memory = JSON.stringify(snap);
        return true;
      } catch (err) { return false; }        /* quota lost: the session still works */
    },
    /* In-memory mode keeps its own dump so a reset can undo it, and so clear()
       means the same thing in both kinds. */
    clear() {
      try { if (usable) localStorage.removeItem(STORE_KEY); else memory = null; } catch (err) {}
    }
  };
})();

function cloneRecords(list) { return JSON.parse(JSON.stringify(list)); }

function replaceContents(target, incoming) {
  if (!Array.isArray(incoming)) return target;
  target.length = 0;
  incoming.forEach(item => target.push(item));
  return target;
}

/* Captured before anything is hydrated: the seed is the pristine demo data, so a
   reset can restore records that were mutated in place. */
const SEED = {
  providers: cloneRecords(PROVIDERS),
  bookings: cloneRecords(BOOKINGS),
  customers: cloneRecords(CUSTOMERS),
  listings: cloneRecords(LISTINGS),
  notifications: cloneRecords(NOTIFICATIONS),
  disputes: cloneRecords(DISPUTES),
  payments: cloneRecords(PAYMENTS),
  payouts: cloneRecords(PAYOUTS),
  statusEvents: cloneRecords(STATUS_EVENTS),
  messages: cloneRecords(MESSAGES),
  ledger: cloneRecords(LEDGER),
  config: cloneRecords(CONFIG)
};

/* Only records. Which tab is open, which sheet is raised and where the screen
   was scrolled are not data and are never persisted. */
function snapshot() {
  return {
    schemaVersion: SCHEMA_VERSION,
    savedAt: new Date().toISOString(),
    providers: PROVIDERS,
    bookings: BOOKINGS,
    customers: CUSTOMERS,
    listings: LISTINGS,
    notifications: NOTIFICATIONS,
    disputes: DISPUTES,
    payments: PAYMENTS,
    payouts: PAYOUTS,
    statusEvents: STATUS_EVENTS,
    messages: MESSAGES,
    ledger: LEDGER,
    config: CONFIG,
    /* The change log travels with the values it describes. A console that shows a
       15% rate with no record of who set it is not auditable (AGENTS.md 29, 31). */
    configAudit: CONFIG_AUDIT,
    profileData: state.profileData,
    providerSettings: { availability: state.providerAvailability, emergencyDispatch: state.providerEmergencyDispatch },
    providerProfileData: state.providerProfileData
  };
}

function persist() { return Store.write(snapshot()); }

function hydrate() {
  const snap = Store.read();
  if (!snap) return { restored: false, kind: Store.kind };
  /* The version number says the shape is right. It does not say the values are.
     A booking whose status the machine does not have would load, print a word no
     screen can explain and have no transitions at all — an inert record. Same for
     a payment state or a ledger account. Such a dump is refused and the app starts
     from the sample records instead of carrying a hole through every screen. */
  if (!Array.isArray(snap.bookings) ||
      snap.bookings.some(b => !b || !BOOKING_STATES[b.status]))
    return { restored:false, kind:Store.kind, rejected:'a booking carries a status the machine does not have' };
  if (snap.bookings.some(b => b.payStatus && !PAYMENT_LABELS[b.payStatus]))
    return { restored:false, kind:Store.kind, rejected:'a booking carries a payment state that does not exist' };
  if (Array.isArray(snap.ledger) &&
      snap.ledger.some(e => !e.lines || e.lines.some(l => !ACCOUNTS[l.account])))
    return { restored:false, kind:Store.kind, rejected:'the ledger names an account that does not exist' };
  replaceContents(PROVIDERS, snap.providers);
  replaceContents(BOOKINGS, snap.bookings);
  replaceContents(CUSTOMERS, snap.customers);
  replaceContents(LISTINGS, snap.listings);
  replaceContents(NOTIFICATIONS, snap.notifications);
  replaceContents(DISPUTES, snap.disputes);
  DISPUTES.forEach(d => { const n = parseInt(String(d.id).split('-').pop(), 10); if (!Number.isNaN(n) && n > disputeSeq) disputeSeq = n; });
  replaceContents(PAYMENTS, snap.payments);
  replaceContents(PAYOUTS, snap.payouts);
  replaceContents(STATUS_EVENTS, snap.statusEvents);
  if (snap.messages) replaceContents(MESSAGES, snap.messages);
  MESSAGES.forEach(m => { const n = parseInt(String(m.id).replace(/[^0-9]/g, ''), 10);
                          if (!Number.isNaN(n) && n > messageSeq) messageSeq = n; });
  PAYMENTS.forEach(p => { const n = parseInt(String(p.id).replace(/[^0-9]/g, ''), 10);
                          if (!Number.isNaN(n) && n > paymentSeq) paymentSeq = n; });
  PAYOUTS.forEach(p => { const n = parseInt(String(p.id).replace(/[^0-9]/g, ''), 10);
                         if (!Number.isNaN(n) && n > payoutSeq) payoutSeq = n; });
  replaceContents(LEDGER, snap.ledger);
  STATUS_EVENTS.forEach(e => { const n = parseInt(String(e.id).replace(/[^0-9]/g, ''), 10);
                               if (!Number.isNaN(n) && n > statusEventSeq) statusEventSeq = n; });
  if (snap.config) Object.assign(CONFIG, snap.config);
  /* The log of every rate change comes back with the rates it describes, so an
     administrator's decision is still on the record after a reload (29, 31). */
  if (snap.configAudit) replaceContents(CONFIG_AUDIT, snap.configAudit);
  /* The log of those changes has to come back with them, or a restored device
     shows a rate nobody is able to account for. */
  if (snap.configAudit) replaceContents(CONFIG_AUDIT, snap.configAudit);
  /* Ledger ids are a sequence, not a timestamp. A restored dump has to raise the
     counter past its own entries or the next event reuses an id already booked. */
  LEDGER.forEach(e => { const n = parseInt(String(e.id).replace(/[^0-9]/g, ''), 10);
                        if (!Number.isNaN(n) && n > ledgerSeq) ledgerSeq = n; });
  if (snap.profileData) Object.assign(state.profileData, snap.profileData);
  if (snap.providerProfileData) Object.assign(state.providerProfileData, snap.providerProfileData);
  if (snap.providerSettings) {
    state.providerAvailability = snap.providerSettings.availability;
    state.providerEmergencyDispatch = !!snap.providerSettings.emergencyDispatch;
  }
  return { restored: true, kind: Store.kind, savedAt: snap.savedAt };
}

/* Back to the demo data the file shipped with, and forget this device's dump. */
function restoreSeed() {
  replaceContents(PROVIDERS, cloneRecords(SEED.providers));
  replaceContents(BOOKINGS, cloneRecords(SEED.bookings));
  replaceContents(CUSTOMERS, cloneRecords(SEED.customers));
  replaceContents(LISTINGS, cloneRecords(SEED.listings));
  replaceContents(NOTIFICATIONS, cloneRecords(SEED.notifications));
  replaceContents(DISPUTES, []);
  disputeSeq = 0;
  replaceContents(PAYMENTS, []);
  replaceContents(PAYOUTS, []);
  paymentSeq = 0; payoutSeq = 0;
  replaceContents(STATUS_EVENTS, []);
  statusEventSeq = 0;
  replaceContents(MESSAGES, []);
  messageSeq = 0;
  replaceContents(LEDGER, []);
  Object.keys(CONFIG).forEach(k => delete CONFIG[k]);
  Object.assign(CONFIG, cloneRecords(CONFIG_DEFAULTS));
  CONFIG_AUDIT.length = 0;
  seedHistoricalLedger();
  seedStatusHistory();
  seedMessages();
  seedDemoDispute();
  Store.clear();
  return persist();
}
